<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>мои лекции и практики</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0f2f5;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px 15px;
        }
        .box {
            max-width: 1100px;
            margin: 0 auto;
        }
        .title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1e4663;
            border-left: 5px solid #1e4663;
            padding-left: 15px;
        }
        .sub {
            font-size: 13px;
            color: #4a627a;
            margin-bottom: 25px;
            padding-left: 20px;
        }
        .form-card {
            background: white;
            border: 1px solid #ccc;
            padding: 18px 15px;
            margin-bottom: 25px;
            border-radius: 12px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1 1 150px;
        }
        .field label {
            font-size: 11px;
            font-weight: bold;
            color: #2c3e4e;
            text-transform: uppercase;
        }
        .field input, .field select, .field textarea {
            padding: 8px 10px;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            font-family: Arial, sans-serif;
        }
        .field textarea {
            resize: vertical;
            min-height: 70px;
        }
        .field input[type="file"] {
            padding: 5px;
        }
        button {
            background: #2c6b2f;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background: #1f5222;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #dbdbdb;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            color: #222;
            font-weight: normal;
        }
        .filter-btn.active {
            background: #2c6b2f;
            color: white;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            border: 1px solid #ccc;
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            transition: 0.1s;
        }
        .card:hover {
            background: #fefef7;
            border-color: #888;
        }
        .badge-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: bold;
        }
        .disc {
            background: #e9ecef;
            padding: 2px 10px;
            border-radius: 40px;
            color: #1e4663;
        }
        .type-badge {
            padding: 2px 10px;
            border-radius: 40px;
        }
        .лекция {
            background: #ffedd5;
            color: #8b5a2b;
        }
        .практическая {
            background: #d9f0fc;
            color: #1f6392;
        }
        .card h4 {
            font-size: 17px;
            margin: 8px 0 6px;
            color: #0c2f44;
        }
        .desc-preview {
            font-size: 12px;
            color: #4b5e72;
            margin-bottom: 10px;
            line-height: 1.35;
        }
        .file-block {
            background: #f2f2f2;
            border-radius: 40px;
            padding: 5px 10px;
            margin: 8px 0 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-link {
            text-decoration: none;
            color: #2266aa;
            font-weight: 500;
            cursor: pointer;
        }
        .remove-file {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 16px;
            cursor: pointer;
            padding: 0 5px;
            font-weight: bold;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            font-size: 10px;
            color: #6c7f94;
        }
        .actions button {
            background: #e7e7e7;
            color: #2c3e50;
            padding: 4px 10px;
            font-size: 11px;
            margin-left: 5px;
            border-radius: 20px;
            cursor: pointer;
            border: none;
        }
        .empty {
            text-align: center;
            padding: 40px;
            background: #f9f9f9;
            border-radius: 20px;
            color: #6f8daa;
            border: 1px dashed #bbb;
        }
        footer {
            margin-top: 30px;
            font-size: 10px;
            text-align: center;
            color: #8a9bb0;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        /* === модальное окно для полного текста === */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            overflow-y: auto;
            padding: 30px 15px;
        }
        .modal-content {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 25px;
            position: relative;
            box-shadow: 0 12px 30px black;
        }
        .close-modal {
            position: absolute;
            top: 15px; right: 22px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            color: #777;
        }
        .close-modal:hover { color: black; }
        .modal h2 {
            margin-bottom: 12px;
            color: #1e4663;
            padding-right: 30px;
        }
        .modal-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            flex-wrap: wrap;
        }
        .modal-fulltext {
            font-size: 15px;
            line-height: 1.55;
            color: #1e2f3c;
            white-space: pre-wrap;
            margin-bottom: 25px;
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
        }
        .conclusion-block {
            background: #f4f9fe;
            padding: 18px;
            border-radius: 16px;
            margin: 20px 0;
            border-left: 5px solid #2c6b2f;
        }
        .conclusion-block h4 {
            margin-bottom: 8px;
            color: #1e5a2a;
        }
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: #e0e7ef;
            color: #1e4663;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .nav-btn:hover {
            background: #cbdbe5;
        }
        hr {
            margin: 15px 0;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="title">📁 мои записи</div>
    <div class="sub">лекции + практика + pdf + полный текст + выводы</div>

    <div class="form-card">
        <div class="form-row">
            <div class="field">
                <label>Дисциплина</label>
                <input type="text" id="disc" placeholder="Информатика, Прогр..." autocomplete="off">
            </div>
            <div class="field">
                <label>Тип</label>
                <select id="type">
                    <option value="лекция">лекция</option>
                    <option value="практическая">практика</option>
                </select>
            </div>
            <div class="field">
                <label>Название</label>
                <input type="text" id="title" placeholder="Тема">
            </div>
            <div class="field">
                <label>Краткое описание (превью)</label>
                <input type="text" id="desc" placeholder="коротко">
            </div>
            <div class="field">
                <label>Полный текст (лекция/задание)</label>
                <textarea id="fullText" rows="2" placeholder="Вставь полный текст лекции или описание практики..."></textarea>
            </div>
            <div class="field">
                <label>PDF (опционально)</label>
                <input type="file" id="pdfFile" accept=".pdf">
            </div>
            <button id="addBtn">+ добавить</button>
        </div>
    </div>

    <div class="filter-bar">
        <button data-filter="all" class="filter-btn active">все</button>
        <button data-filter="лекция" class="filter-btn">лекции</button>
        <button data-filter="практическая" class="filter-btn">практика</button>
    </div>

    <div id="cardsGrid" class="cards-grid"></div>
    <footer>сохраняется в браузере • кликни по карточке → полный текст + выводы + навигация</footer>
</div>

<!-- модальное окно -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 id="modalTitle"></h2>
        <div class="modal-meta">
            <span id="modalDiscipline"></span>
            <span id="modalType"></span>
            <span id="modalDate"></span>
        </div>
        <div id="modalFullText" class="modal-fulltext"></div>
        <div id="modalConclusion" class="conclusion-block"></div>
        <div id="modalFileLink"></div>
        <div class="nav-buttons">
            <button id="prevBtn" class="nav-btn">◀ предыдущая</button>
            <button id="homeBtn" class="nav-btn">🏠 главная</button>
            <button id="nextBtn" class="nav-btn">следующая ▶</button>
        </div>
    </div>
</div>

<script>
    // --- данные с поддержкой полного текста и выводов ---
    let items = [];
    const STORAGE_KEY = "simple_student_fulltext_v2";
    let currentFilter = "all";
    let currentModalId = null;   // id открытой записи
    let modalOrderList = [];      // упорядоченный список id для навигации

    // загрузка
    function loadData() {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                items = JSON.parse(raw);
                items.forEach(i => {
                    if (i.createdAt && typeof i.createdAt === "string") i.createdAt = new Date(i.createdAt);
                    else if (!i.createdAt) i.createdAt = new Date();
                    if (!i.fullText) i.fullText = "";
                    if (!i.conclusion) i.conclusion = "";
                });
            } catch(e) { items = []; }
        }
        if (items.length === 0) {
            let now = new Date();
            items = [
                { 
                    id: "ex1", discipline: "Информатика", type: "лекция", 
                    title: "Информатика — основы", 
                    description: "системы счисления, алфавит, биты",
                    fullText: "Лекция 1. Основы информатики.\n\nИнформатика — это наука о методах получения, хранения, обработки и передачи информации. Основополагающие понятия: данные, сигнал, информация. Рассматриваются позиционные системы счисления: двоичная, восьмеричная, шестнадцатеричная. Перевод чисел из одной системы в другую. Единицы измерения информации: бит, байт, килобайт и т.д. Архитектура компьютера: процессор, память, устройства ввода-вывода. Программное обеспечение: системное и прикладное. Алгоритмизация и базовые алгоритмические структуры (следование, ветвление, цикл).",
                    conclusion: "Информатика оперирует понятиями информации и данных. Ключевые навыки: перевод между системами счисления, понимание устройства ПК, основы алгоритмизации. Эти знания фундаментальны для дальнейшего изучения программирования.",
                    createdAt: new Date(now.getFullYear(), now.getMonth(), now.getDate()-1), fileName: null, fileData: null
                },
                { 
                    id: "ex2", discipline: "Информатика", type: "практическая", 
                    title: "Практика: системы счисления", 
                    description: "задачи на перевод чисел",
                    fullText: "Практическое задание №1.\n\nЗадача 1: Перевести число 101101₂ в десятичную систему.\nРешение: 1*2^5 + 0*2^4 + 1*2^3 + 1*2^2 + 0*2^1 + 1*2^0 = 32+0+8+4+0+1 = 45.\nЗадача 2: Перевести 10A₁₆ в десятичную.\nРешение: 1*16^2 + 0*16 + 10 = 256+10=266.\nЗадача 3: Сложить двоичные числа 1101 и 1011.\nОтвет: 11000₂.\nЗадача 4: Перевести 99₁₀ в двоичную (деление на 2): 99 = 1100011₂.\nДополнительные упражнения: перевести 0.75₁₀ в двоичную дробь, выполнить арифметику в разных СС.",
                    conclusion: "Выводы: перевод чисел между системами — базовый навык. Регулярное решение задач помогает автоматизировать этот процесс. Важно понимать разрядность и веса разрядов.",
                    createdAt: new Date(now.getFullYear(), now.getMonth(), now.getDate()-3), fileName: null, fileData: null
                },
                { 
                    id: "ex3", discipline: "Программирование", type: "лекция", 
                    title: "Python: введение", 
                    description: "основы, переменные, типы",
                    fullText: "Лекция по Python.\nPython — интерпретируемый язык высокого уровня. Переменные не требуют явного объявления типа. Основные типы данных: int, float, str, bool, list, tuple, dict. Условный оператор if-elif-else. Циклы while и for. Функции: определение через def, возврат результата. Пример: def sum(a,b): return a+b. Работа со списками: добавление, удаление, срезы. Ввод/вывод: input(), print(). Рекомендации по стилю кода (PEP8).",
                    conclusion: "Python прост для начинающих, но мощный. Освоив типы данных, условия и циклы, можно переходить к решению алгоритмических задач и работе с библиотеками.",
                    createdAt: new Date(now.getFullYear(), now.getMonth(), now.getDate()-5), fileName: null, fileData: null
                }
            ];
            save();
        }
    }

    function save() {
        let toStore = items.map(i => ({
            ...i,
            createdAt: i.createdAt instanceof Date ? i.createdAt.toISOString() : i.createdAt
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toStore));
    }

    function genId() {
        return Date.now() + '-' + Math.random().toString(36).substring(2, 10);
    }

    function readPdf(file) {
        return new Promise((resolve, reject) => {
            let reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject();
            reader.readAsDataURL(file);
        });
    }

    async function addItem(discipline, type, title, description, fullText, file) {
        if (!discipline.trim()) { alert("напиши дисциплину"); return false; }
        if (!title.trim()) { alert("напиши название"); return false; }
        let fileData = null, fileName = null;
        if (file && file.type === "application/pdf") {
            if (file.size > 20 * 1024 * 1024) { alert("PDF больше 20мб"); return false; }
            try {
                fileData = await readPdf(file);
                fileName = file.name;
            } catch(e) { alert("ошибка чтения файла"); return false; }
        } else if (file && file.size > 0) {
            alert("только PDF файлы"); return false;
        }
        // авто-генерация выводов, если поле fullText не пустое, но можно потом редактировать.
        let conclusionText = `Выводы по ${type === 'лекция' ? 'лекции' : 'практической работе'}: изученный материал закреплён. Рекомендуется повторить ключевые моменты.`;
        if (fullText && fullText.trim().length > 20) {
            conclusionText = `📌 Выводы: ${fullText.trim().substring(0, 150)}... Практическое применение полученных знаний важно для дальнейшего обучения.`;
        }
        let newItem = {
            id: genId(),
            discipline: discipline.trim(),
            type: type,
            title: title.trim(),
            description: description.trim() || "—",
            fullText: fullText.trim() || "Полный текст не добавлен. Отредактируй запись, чтобы вставить содержание.",
            conclusion: conclusionText,
            createdAt: new Date(),
            fileName: fileName,
            fileData: fileData
        };
        items.unshift(newItem);
        save();
        return true;
    }

    function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        save();
        if (currentModalId === id) closeModal();
        render();
    }

    function editItem(id) {
        let item = items.find(i => i.id === id);
        if (!item) return;
        let newTitle = prompt("название:", item.title);
        if (newTitle !== null && newTitle.trim() !== "") item.title = newTitle.trim();
        let newDesc = prompt("краткое описание (превью):", item.description);
        if (newDesc !== null) item.description = newDesc.trim() || "—";
        let newDisc = prompt("дисциплина:", item.discipline);
        if (newDisc !== null && newDisc.trim() !== "") item.discipline = newDisc.trim();
        let newFull = prompt("полный текст (лекция/практика):", item.fullText);
        if (newFull !== null) item.fullText = newFull.trim() || "—";
        let newConc = prompt("выводы (внизу лекции):", item.conclusion);
        if (newConc !== null) item.conclusion = newConc.trim() || "Выводы: материал усвоен.";
        let changeType = confirm("сменить тип? (OK = лекция / Отмена = практика)");
        if (changeType !== null) {
            item.type = changeType === true ? "лекция" : "практическая";
        }
        save();
        render();
        if (currentModalId === id) {
            openModalById(id);
        }
    }

    function removeFile(id) {
        let item = items.find(i => i.id === id);
        if (item && item.fileData) {
            if (confirm("удалить PDF?")) {
                item.fileData = null;
                item.fileName = null;
                save();
                render();
                if (currentModalId === id) openModalById(id);
            }
        } else {
            alert("нет PDF");
        }
    }

    function downloadPDF(fileData, fileName) {
        let a = document.createElement('a');
        a.href = fileData;
        a.download = fileName || "документ.pdf";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function getFiltered() {
        let filtered = items.filter(i => {
            if (currentFilter === "all") return true;
            return i.type === currentFilter;
        });
        filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
        return filtered;
    }

    // обновить порядок для модалки (текущий отфильтрованный и отсортированный)
    function updateModalOrder() {
        let filtered = getFiltered();
        modalOrderList = filtered.map(i => i.id);
    }

    function openModalById(id) {
        let item = items.find(i => i.id === id);
        if (!item) return;
        currentModalId = id;
        updateModalOrder();
        document.getElementById("modalTitle").innerText = item.title;
        document.getElementById("modalDiscipline").innerHTML = `📖 ${escapeHtml(item.discipline)}`;
        let typeText = item.type === 'лекция' ? '📘 лекция' : '🔧 практическая работа';
        document.getElementById("modalType").innerHTML = typeText;
        let dateStr = item.createdAt instanceof Date ? item.createdAt.toLocaleDateString('ru-RU') : "";
        document.getElementById("modalDate").innerHTML = `📅 ${dateStr}`;
        // полный текст
        let fullHtml = escapeHtml(item.fullText).replace(/\n/g, '<br>');
        document.getElementById("modalFullText").innerHTML = fullHtml || "<i>нет содержания</i>";
        // выводы
        let conclusionHtml = `<h4>✅ Выводы</h4><p>${escapeHtml(item.conclusion).replace(/\n/g, '<br>')}</p>`;
        document.getElementById("modalConclusion").innerHTML = conclusionHtml;
        // ссылка на PDF, если есть
        let fileHtml = '';
        if (item.fileData && item.fileName) {
            fileHtml = `<div style="margin: 10px 0;"><button id="modalDownloadPdf" style="background:#2c6b2f;">📎 скачать PDF: ${escapeHtml(item.fileName)}</button></div>`;
        }
        document.getElementById("modalFileLink").innerHTML = fileHtml;
        document.getElementById("modal").style.display = "block";
        // вешаем обработчик скачивания
        let downBtn = document.getElementById("modalDownloadPdf");
        if (downBtn) {
            downBtn.onclick = () => {
                if (item.fileData) downloadPDF(item.fileData, item.fileName);
                else alert("файл отсутствует");
            };
        }
    }

    function closeModal() {
        document.getElementById("modal").style.display = "none";
        currentModalId = null;
    }

    function navigate(direction) {
        if (!currentModalId) return;
        let idx = modalOrderList.indexOf(currentModalId);
        if (direction === 'prev' && idx > 0) {
            openModalById(modalOrderList[idx-1]);
        } else if (direction === 'next' && idx < modalOrderList.length-1) {
            openModalById(modalOrderList[idx+1]);
        } else if (direction === 'home') {
            closeModal();
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function formatDate(d) {
        if (!d) return "";
        return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
    }

    function render() {
        let container = document.getElementById('cardsGrid');
        let filtered = getFiltered();
        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty">пусто. добавь лекцию или практику 👆</div>`;
            return;
        }
        container.innerHTML = filtered.map(item => {
            let typeText = item.type === 'лекция' ? '📘 лекция' : '🔧 практика';
            let typeClass = item.type === 'лекция' ? 'лекция' : 'практическая';
            let fileIndicator = item.fileData ? '📎' : '';
            return `
                <div class="card" data-id="${item.id}">
                    <div class="badge-line">
                        <span class="disc">${escapeHtml(item.discipline)} ${fileIndicator}</span>
                        <span class="type-badge ${typeClass}">${typeText}</span>
                    </div>
                    <h4>${escapeHtml(item.title)}</h4>
                    <div class="desc-preview">${escapeHtml(item.description)}</div>
                    <div class="card-footer">
                        <span>📅 ${formatDate(item.createdAt)}</span>
                        <div class="actions">
                            <button class="edit-btn" data-id="${item.id}">ред</button>
                            <button class="del-btn" data-id="${item.id}">уд</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        document.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                let id = btn.getAttribute('data-id');
                if (confirm("удалить запись?")) deleteItem(id);
            });
        });
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                let id = btn.getAttribute('data-id');
                editItem(id);
            });
        });
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('edit-btn') || e.target.classList.contains('del-btn')) return;
                let id = card.getAttribute('data-id');
                openModalById(id);
            });
        });
    }

    function initUI() {
        let add = document.getElementById('addBtn');
        let discInp = document.getElementById('disc');
        let typeInp = document.getElementById('type');
        let titleInp = document.getElementById('title');
        let descInp = document.getElementById('desc');
        let fullTextarea = document.getElementById('fullText');
        let fileInp = document.getElementById('pdfFile');

        add.addEventListener('click', async () => {
            let disc = discInp.value;
            let t = typeInp.value;
            let tit = titleInp.value;
            let des = descInp.value;
            let full = fullTextarea.value;
            let file = fileInp.files[0];
            let ok = await addItem(disc, t, tit, des, full, file);
            if (ok) {
                discInp.value = '';
                titleInp.value = '';
                descInp.value = '';
                fullTextarea.value = '';
                fileInp.value = '';
                render();
            }
        });

        let filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                let f = btn.getAttribute('data-filter');
                currentFilter = f;
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render();
                if (currentModalId) closeModal();
            });
        });

        let modal = document.getElementById('modal');
        let closeSpan = document.querySelector('.close-modal');
        closeSpan.onclick = () => closeModal();
        window.onclick = (event) => { if (event.target === modal) closeModal(); };
        document.getElementById('prevBtn').onclick = () => navigate('prev');
        document.getElementById('nextBtn').onclick = () => navigate('next');
        document.getElementById('homeBtn').onclick = () => navigate('home');
    }

    loadData();
    initUI();
    render();
</script>
</body>
</html>
