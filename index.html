<script>
// ========== ПОЛНЫЙ ТЕКСТ ЛЕКЦИЙ (1-7) ==========
const lectures = [
{id:"lec1",title:"Лекция 1: Введение в архитектуру веб-приложений. Место Django в экосистеме Python",
content:`<h2>1.1. Клиент-серверная архитектура как основа веба</h2><p>Любое веб-приложение строится вокруг взаимодействия двух сторон: клиента и сервера. Клиент (обычно браузер) инициирует обмен, отправляя запрос. Сервер обрабатывает запрос и возвращает ответ. Эта модель предполагает, что сервер не инициирует соединение самостоятельно, а только реагирует на входящие сообщения.</p><p>HTTP (HyperText Transfer Protocol) — основной протокол передачи данных в вебе. Каждый запрос содержит метод, который указывает на тип желаемого действия: GET — запрос на получение данных. Параметры передаются в строке URL. GET не должен изменять состояние сервера. POST — отправка данных на сервер (например, заполненной формы). Данные передаются в теле запроса, не видны в URL. POST предназначен для операций, которые изменяют состояние (создание, обновление, удаление).</p><p>Коды ответов HTTP: 200 (OK) — запрос выполнен успешно; 301/302 (Redirect) — запрошенный ресурс временно или постоянно находится по другому адресу; 403 (Forbidden) — сервер понял запрос, но отказывается его выполнять из-за недостатка прав; 404 (Not Found) — ресурс не найден; 500 (Internal Server Error) — на сервере произошла необработанная ошибка.</p><h2>1.2. Философия Django и его место среди фреймворков</h2><p>Django — это высокоуровневый веб-фреймворк на языке Python, следующий принципу "Batteries included" (с батарейками в комплекте). Из коробки Django включает: ORM, административную панель, систему маршрутизации URL, систему шаблонов, аутентификацию и защиту от CSRF/XSS.</p><h2>1.3. Интерпретатор Python и изоляция окружения</h2><p>Для работы с Django требуется Python 3.10+. Виртуальное окружение (venv) решает проблему конфликта зависимостей.</p><h2>1.4. Структура проекта Django</h2><p>manage.py — утилита для команд; settings.py — центральный файл конфигурации; urls.py — корневая маршрутизация.</p><h2>1.5. Управление зависимостями</h2><p>Файл requirements.txt фиксирует версии пакетов для воспроизводимости окружения.</p>`,
conclusion:`<h3>📌 Выводы по лекции 1</h3><p>Django — мощный фреймворк с принципом "Batteries included", работающий по модели клиент-сервер. Ключевые элементы: HTTP-методы (GET/POST), коды ответов, виртуальные окружения для изоляции проектов. Базовая структура проекта (manage.py, settings.py, urls.py) — фундамент для дальнейшей работы.</p>`},
{id:"lec2",title:"Лекция 2: Организация кода в Django. Модель MVT",
content:`<h2>2.1. Проект и приложение: иерархия компонентов</h2><p>В Django введены два важных понятия: проект и приложение. Проект — это весь веб-сайт в целом. Приложение — это модуль, отвечающий за конкретую функциональность: блог, комментарии, корзина. Приложения проектируются так, чтобы быть переиспользуемыми.</p><h2>2.2. Архитектура MVT (Model-View-Template)</h2><p>Model — описывает структуру данных; View — содержит бизнес-логику обработки запроса; Template — отвечает за представление данных (HTML).</p><h2>2.3. Маршрутизация URL. Диспетчер и конвертеры</h2><p>Маршрутизация (URLconf) связывает URL с представлением. include() подключает маршруты приложений. Конвертеры: int, str, slug, uuid, path.</p><h2>2.4. Система шаблонов</h2><p>Переменные {{ variable }}, теги {% tag %}, фильтры. Наследование через {% extends %} и {% block %}.</p><h2>2.5. Статические файлы</h2><p>CSS, JS хранятся в static/. Тег {% load static %}. В продакшене статику отдаёт веб-сервер.</p>`,
conclusion:`<h3>📌 Выводы по лекции 2</h3><p>Разделение на проект и приложения обеспечивает модульность. MVT — ключевой паттерн Django. Маршрутизация гибкая, поддерживает динамические URL. Система шаблонов с наследованием реализует принцип DRY.</p>`},
{id:"lec3",title:"Лекция 3: Базы данных и объектно-реляционное отображение (ORM)",
content:`<h2>3.1. Модели как описание предметной области</h2><p>Класс наследует models.Model, поля — CharField, TextField, DateTimeField. __str__() и Meta (ordering).</p><h2>3.2. Миграции: эволюция схемы БД</h2><p>makemigrations создаёт миграции, migrate применяет к БД. Не редактировать миграции вручную.</p><h2>3.3. Объектно-реляционное отображение (ORM)</h2><p>CRUD: create(), filter(), get(), update(), delete(). QuerySet ленивый.</p><h2>3.4. Связи между таблицами</h2><p>ForeignKey (один ко многим), ManyToManyField, OneToOneField. Параметр on_delete (CASCADE, PROTECT).</p>`,
conclusion:`<h3>📌 Выводы по лекции 3</h3><p>Модели — Python-классы, отображаемые на таблицы БД. Миграции позволяют безопасно эволюционировать схему. ORM предоставляет CRUD-операции без SQL. Связи между таблицами задаются специальными полями.</p>`},
{id:"lec4",title:"Лекция 4: Автоматическая административная панель",
content:`<h2>4.1. Архитектура и назначение Django Admin</h2><p>Полноценный веб-интерфейс по пути /admin/ для superuser. Просмотр, добавление, редактирование, удаление записей.</p><h2>4.2. Регистрация моделей</h2><p>admin.site.register(MyModel) в admin.py.</p><h2>4.3. Кастомизация отображения списка</h2><p>list_display, list_filter, search_fields, ordering, list_per_page.</p><h2>4.4. Настройка формы редактирования</h2><p>fields / fieldsets (группировка с collapse), prepopulated_fields для slug.</p><h2>4.5. Действия над группой записей</h2><p>Кастомные actions (make_published).</p>`,
conclusion:`<h3>📌 Выводы по лекции 4</h3><p>Django Admin — мощный инструмент управления контентом. Кастомизация через ModelAdmin: list_display, list_filter, search_fields, fieldsets, prepopulated_fields. Действия позволяют выполнять массовые операции.</p>`},
{id:"lec5",title:"Лекция 5: Формы и приём данных от пользователя",
content:`<h2>5.1. Проблема обработки пользовательского ввода</h2><p>Автоматизация генерации HTML, очистки, валидации, повторного отображения с ошибками.</p><h2>5.2. Два типа форм: Form и ModelForm</h2><p>forms.Form — независимая; forms.ModelForm — привязана к модели, с save().</p><h2>5.3. Жизненный цикл обработки формы</h2><p>GET (пустая форма) / POST (данные), is_valid(), cleaned_data, редирект.</p><h2>5.4. Валидация: уровни и механизмы</h2><p>clean_&lt;field&gt;(), clean() формы, ValidationError.</p><h2>5.5. Защита от CSRF</h2><p>Тег {% csrf_token %} обязателен в каждой форме.</p>`,
conclusion:`<h3>📌 Выводы по лекции 5</h3><p>Формы Django автоматизируют работу с пользовательским вводом. ModelForm связана с моделью. Жизненный цикл: GET/POST/is_valid. Многоуровневая валидация. CSRF-защита обязательна.</p>`},
{id:"lec6",title:"Лекция 6: Работа с медиа-файлами",
content:`<h2>6.1. Отличие статических от медиа-файлов</h2><p>Статика — часть приложения (CSS, JS). Медиа — загружаются пользователями (аватарки, фото).</p><h2>6.2. Настройка хранения медиа-файлов</h2><p>MEDIA_URL, MEDIA_ROOT. Для разработки static() в urls.py.</p><h2>6.3. Модели с файловыми полями</h2><p>FileField, ImageField. upload_to. Требуется Pillow.</p><h2>6.4. Обработка загруженных файлов в формах</h2><p>enctype="multipart/form-data", request.FILES.</p><h2>6.5. Миниатюры и оптимизация</h2><p>sorl-thumbnail, ресайз в модели через save().</p>`,
conclusion:`<h3>📌 Выводы по лекции 6</h3><p>Медиа-файлы требуют отдельных настроек. ImageField требует Pillow. upload_to организует хранение. Формы с файлами требуют enctype. Миниатюры создаются через sorl-thumbnail.</p>`},
{id:"lec7",title:"Лекция 7: Отладка, оптимизация и деплой",
content:`<h2>7.1. Логирование</h2><p>logging предпочтительнее print(). LOGGING в settings.py.</p><h2>7.2. Django Debug Toolbar</h2><p>Показывает SQL-запросы, время выполнения.</p><h2>7.3. Проблема N+1 запроса</h2><p>select_related() и prefetch_related() для оптимизации.</p><h2>7.4. Настройки перед деплоем</h2><p>DEBUG=False, ALLOWED_HOSTS, SECRET_KEY в .env, collectstatic.</p><h2>7.5. Продакшен-стек</h2><p>Gunicorn + Nginx + PostgreSQL.</p>`,
conclusion:`<h3>📌 Выводы по лекции 7</h3><p>Логирование вместо print. Debug Toolbar для поиска узких мест. N+1 решается через select_related/prefetch_related. Деплой: DEBUG=False, ALLOWED_HOSTS, .env, collectstatic, Gunicorn.</p>`}
];

// ========== ПОЛНЫЙ ТЕКСТ ПРАКТИК (1-7) ==========
const practices = [
{id:"pr1",title:"Практика №1. Установка и настройка окружения",
content:`<ol><li>Проверьте версию установленного Python. Она должна быть 3.10 или выше.</li><li>Создайте новую директорию для проекта с именем django_practice_1.</li><li>Внутри директории создайте виртуальное окружение с именем venv.</li><li>Активируйте виртуальное окружение и убедитесь, что в начале строки терминала появился префикс (venv).</li><li>Установите Django версии 4.2 LTS.</li><li>Проверьте установку, выполнив команду python -m django --version. Запишите точную версию.</li><li>Создайте новый проект с именем mynews.</li><li>Перейдите в папку проекта mynews.</li><li>Запустите сервер разработки и убедитесь, что он запустился на порту 8000.</li><li>Откройте браузер и перейдите по адресу http://127.0.0.1:8000. Запишите слова, которые видите на странице-приветствии.</li><li>Остановите сервер и запустите его на порту 9000.</li><li>Откройте ту же страницу на новом порту. Убедитесь, что сайт доступен.</li><li>Остановите сервер ещё раз.</li><li>Откройте файл settings.py в текстовом редакторе. Найдите переменную DEBUG. Чему она равна?</li><li>Найдите переменную ALLOWED_HOSTS. Какое у неё значение по умолчанию?</li><li>Найдите переменную INSTALLED_APPS. Перечислите названия встроенных приложений.</li><li>Найдите переменную DATABASES. Какая база данных используется по умолчанию?</li><li>Найдите переменную LANGUAGE_CODE и TIME_ZONE. Запишите их значения.</li><li>Откройте файл urls.py. Какой путь ведёт к административной панели?</li><li>Откройте файл asgi.py и wsgi.py. В одном предложении объясните разницу между ними.</li><li>Создайте в корне проекта файл .gitignore для Python-проекта. Добавьте туда папку venv, __pycache__, файл базы данных db.sqlite3.</li><li>Активируйте виртуальное окружение.</li><li>Выполните pip freeze. Запишите, какие пакеты и версии отобразились.</li><li>Сохраните все зависимости в файл requirements.txt.</li><li>Деактивируйте виртуальное окружение командой deactivate.</li><li>Активируйте окружение снова. Удалите папку venv и создайте её заново.</li><li>Восстановите все зависимости из requirements.txt. Убедитесь, что Django снова работает.</li><li>Измените LANGUAGE_CODE на 'ru-ru' и TIME_ZONE на 'Europe/Moscow'.</li><li>Перезапустите сервер. Изменилось ли что-то на странице-приветствии?</li><li>Выключите сервер и измените DEBUG на False. Попробуйте снова запустить сервер. Опишите, что произошло.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №1</h3><p>Вы научились создавать виртуальное окружение, устанавливать Django, создавать проект. Изучили структуру settings.py, запуск сервера на разных портах, работу с зависимостями.</p>`},
{id:"pr2",title:"Практика №2. Маршруты, представления, шаблоны",
content:`<ol><li>В уже существующем проекте mynews создайте новое приложение с именем posts.</li><li>Зарегистрируйте приложение posts в INSTALLED_APPS.</li><li>В файле views.py приложения posts создайте функцию index, которая возвращает HttpResponse с текстом «Страница новостей».</li><li>Создайте в приложении posts файл urls.py.</li><li>Добавьте в urlpatterns маршрут для пустого пути, ведущий на представление index. Дайте маршруту имя home.</li><li>В корневом urls.py проекта подключите маршруты приложения posts с помощью include. Используйте префикс posts/.</li><li>Запустите сервер и перейдите по адресу http://127.0.0.1:8000/posts/. Убедитесь, что видите нужный текст.</li><li>Добавьте второе представление about, возвращающее HttpResponse с текстом «О проекте».</li><li>Пропишите маршрут for about/ в приложении posts. Дайте имя about.</li><li>Перейдите в браузере на /posts/about/. Убедитесь, что страница открывается.</li><li>Создайте третье представление post_detail, которое принимает параметр post_id.</li><li>Представление должно возвращать HttpResponse с текстом «Вы смотрите пост номер Х», где Х — переданный идентификатор.</li><li>Добавьте динамический маршрут post/&lt;int:post_id&gt;/ и дайте имя post_detail.</li><li>Перейдите на /posts/post/42/. Убедитесь, что видите правильный номер.</li><li>Внутри приложения posts создайте папку templates, а внутри неё папку posts.</li><li>Создайте файл base.html в папке templates/posts. Напишите базовую HTML-структуру с блоком content.</li><li>Создайте файл index.html, расширяющий base.html. В блоке content напишите «Добро пожаловать на сайт новостей».</li><li>Измените представление index так, чтобы оно использовало render с шаблоном posts/index.html.</li><li>Перезагрузите страницу /posts/. Убедитесь, что теперь отображается HTML, а не просто текст.</li><li>Создайте шаблон about.html, расширяющий base.html. Напишите произвольный текст о сайте.</li><li>Измените представление about на рендер шаблона posts/about.html.</li><li>В шаблоне index.html создайте ссылку на страницу about с использованием тега url и имени about.</li><li>В шаблоне index.html создайте ссылку на детальную страницу поста с post_id=1, используя имя post_detail.</li><li>Внутри приложения posts создайте папку static, а внутри неё папку posts и файл style.css.</li><li>В style.css напишите правило, которое меняет цвет заголовка h1 на синий.</li><li>В базовом шаблоне base.html загрузите статические файлы с помощью {% load static %}.</li><li>Подключите style.css в base.html с помощью тега link и хелпера static.</li><li>Убедитесь, что заголовок на всех страницах стал синим.</li><li>Добавьте в base.html блок title, а в дочерних шаблонах переопределите его, задавая разные заголовки для разных страниц.</li><li>Проверьте, что вкладки браузера для разных страниц показывают разные названия.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №2</h3><p>Вы научились создавать приложения, настраивать маршрутизацию, работать с шаблонами и наследованием, подключать статические файлы.</p>`},
{id:"pr3",title:"Практика №3. Модели, миграции, ORM",
content:`<ol><li>В приложении posts откройте файл models.py.</li><li>Создайте модель Post с полями title (CharField, максимальная длина 200), content (TextField), published_date (DateTimeField с auto_now_add=True), is_published (BooleanField со значением по умолчанию False).</li><li>Добавьте в модель метод __str__, который возвращает значение поля title.</li><li>Добавьте внутренний класс Meta с атрибутом ordering = ['-published_date'].</li><li>Выполните команду makemigrations. Убедитесь, что создан файл миграции.</li><li>Выполните команду migrate. Убедитесь, что таблица создана в базе данных.</li><li>Добавьте в модель поле slug (SlugField с unique=True и max_length=200).</li><li>Создайте новую миграцию для добавления поля slug.</li><li>Примените миграцию.</li><li>Запустите оболочку Django с помощью python manage.py shell.</li><li>Импортируйте модель Post из вашего приложения.</li><li>Создайте первый объект Post с помощью метода create. title = «Первый пост», slug = «pervyy-post», content = «Текст первого поста».</li><li>Создайте второй объект Post. title = «Второй пост», slug = «vtoroy-post», is_published = True.</li><li>Получите все объекты Post с помощью Post.objects.all(). Выведите их на экран.</li><li>Отфильтруйте опубликованные посты с помощью Post.objects.filter(is_published=True).</li><li>Получите один пост по slug = «pervyy-post» с помощью Post.objects.get(slug='pervyy-post').</li><li>Измените заголовок этого поста на «Первый пост (изменённый)» и сохраните.</li><li>Удалите второй пост с помощью метода delete().</li><li>Убедитесь, что Post.objects.all() возвращает только один пост.</li><li>Выйдите из оболочки Django.</li><li>В представлении index измените код так, чтобы он получал все посты из базы данных и передавал их в шаблон через контекст.</li><li>В шаблоне index.html добавьте цикл {% for post in posts %}, который выводит заголовок каждого поста и дату публикации.</li><li>Добавьте условие {% if post.is_published %}, чтобы отмечать опубликованные посты зелёным цветом.</li><li>В шаблоне index.html создайте ссылку на детальную страницу поста, используя post.slug в параметре.</li><li>В представлении post_detail напишите код, который получает пост по параметру slug (не post_id).</li><li>Если пост не найден, возвращайте HttpResponse с текстом «Пост не найден» и статусом 404.</li><li>Создайте шаблон post_detail.html, расширяющий base.html. Выведите в нём заголовок поста, дату публикации и содержимое.</li><li>В шаблоне post_detail.html добавьте фильтр linebreaks для поля content, чтобы переносы строк превращались в абзацы.</li><li>Добавьте в представление post_detail обработку случая, когда пост не опубликован (is_published = False). В этом случае тоже возвращайте 404.</li><li>Проверьте в браузере страницы списка постов и детальные страницы для существующего и несуществующего slug.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №3</h3><p>Вы создали модель Post, выполнили миграции. Освоили CRUD-операции через ORM. Интегрировали модели с представлениями и шаблонами.</p>`},
{id:"pr4",title:"Практика №4. Административная панель",
content:`<ol><li>Создайте суперпользователя с помощью команды createsuperuser.</li><li>Запустите сервер и перейдите в административную панель по адресу /admin.</li><li>Войдите с созданными учётными данными.</li><li>Убедитесь, что раздела Posts нет.</li><li>В файле admin.py приложения posts импортируйте модель Post.</li><li>Зарегистрируйте модель с помощью admin.site.register(Post).</li><li>Обновите страницу админки. Теперь раздел Posts должен появиться.</li><li>Добавьте новый пост через админку.</li><li>Создайте класс PostAdmin, наследующий от admin.ModelAdmin.</li><li>Добавьте атрибут list_display = ('id', 'title', 'published_date', 'is_published').</li><li>Зарегистрируйте модель Post с классом PostAdmin.</li><li>Добавьте list_filter = ('is_published', 'published_date').</li><li>Добавьте search_fields = ('title', 'content').</li><li>Добавьте list_display_links = ('title',).</li><li>Добавьте list_per_page = 5.</li><li>Добавьте prepopulated_fields = {'slug': ('title',)}.</li><li>Используйте fieldsets вместо fields: две группы «Основное» и «Публикация».</li><li>Добавьте во вторую группу classes = ('collapse').</li><li>Создайте кастомное действие make_published.</li><li>Добавьте это действие в PostAdmin в атрибут actions.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №4</h3><p>Вы создали суперпользователя, зарегистрировали модель в админке. Настроили отображение списка, форму редактирования, добавили кастомное действие.</p>`},
{id:"pr5",title:"Практика №5. Формы и комментарии",
content:`<ol><li>Создайте в приложении posts файл forms.py.</li><li>Создайте модель Comment с полями post (ForeignKey к Post, on_delete=CASCADE), author_name (CharField, max_length=100), text (TextField), created_at (DateTimeField с auto_now_add=True).</li><li>Выполните makemigrations и migrate.</li><li>Зарегистрируйте модель Comment в админке.</li><li>В forms.py создайте форму CommentForm как ModelForm для модели Comment.</li><li>В Meta-классе укажите model = Comment и fields = ['author_name', 'text'].</li><li>В представлении post_detail добавьте обработку формы комментария.</li><li>Если метод POST, создайте экземпляр CommentForm с request.POST.</li><li>Если форма валидна, создайте комментарий с commit=False, присвойте полю post текущий пост, затем сохраните.</li><li>После сохранения выполните редирект на ту же детальную страницу.</li><li>Если метод GET, создайте пустую форму CommentForm.</li><li>Передайте форму в контекст шаблона.</li><li>В шаблоне добавьте форму с method="post" и {% csrf_token %}.</li><li>Выведите поля с помощью {{ form.as_p }}.</li><li>Добавьте кнопку отправки.</li><li>Выведите список всех комментариев к посту.</li><li>Добавьте валидацию поля author_name: оно не должно содержать цифры (clean_author_name).</li><li>Добавьте валидацию на уровне clean: если поле text содержит слово «спам», форма невалидна.</li><li>Добавьте проверку: если пост не опубликован, не показывайте форму комментария.</li><li>Создайте форму поиска и добавьте поиск в представление index.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №5</h3><p>Вы создали модель Comment и форму ModelForm. Реализовали обработку POST, валидацию, сохранение комментариев. Добавили вывод комментариев и форму поиска.</p>`},
{id:"pr6",title:"Практика №6. Загрузка файлов",
content:`<ol><li>Добавьте в модель Post поле image (ImageField) с параметром upload_to='posts_images/', blank=True, null=True.</li><li>Установите библиотеку Pillow.</li><li>Выполните makemigrations и migrate.</li><li>В админке убедитесь, что появилось поле для загрузки изображения.</li><li>Добавьте в модель Comment поле image.</li><li>В settings.py добавьте MEDIA_URL = '/media/' и MEDIA_ROOT = BASE_DIR / 'media'.</li><li>В корневом urls.py добавьте статическую раздачу медиа для режима разработки.</li><li>В шаблоне post_detail.html выведите изображение поста.</li><li>Добавьте проверку: если у поста есть изображение, показывать его, иначе заглушку.</li><li>В форме комментария добавьте поле image и enctype='multipart/form-data'.</li><li>Добавьте валидацию размера файла (максимум 2 МБ).</li><li>Добавьте валидацию типа файла (PNG, JPEG, GIF).</li><li>Создайте функцию generate_filename на основе UUID.</li><li>Установите sorl-thumbnail, добавьте миниатюры.</li><li>Добавьте в модель Post метод save для ресайза изображений до 1200px.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №6</h3><p>Вы добавили изображения в модели, настроили медиа, добавили валидацию файлов, миниатюры и ресайз.</p>`},
{id:"pr7",title:"Практика №7. Отладка, оптимизация, деплой",
content:`<ol><li>Добавьте логирование в представлениях.</li><li>Настройте LOGGING в settings.py.</li><li>Установите django-debug-toolbar.</li><li>Добавьте debug_toolbar в INSTALLED_APPS и MIDDLEWARE.</li><li>Посмотрите SQL-запросы через панель инструментов.</li><li>Исправьте N+1 через prefetch_related.</li><li>Создайте 100 постов в оболочке Django.</li><li>Добавьте индекс для published_date (db_index=True).</li><li>Установите DEBUG = False и настройте ALLOWED_HOSTS.</li><li>Создайте файл .env с SECRET_KEY.</li><li>Установите python-dotenv, измените settings.py.</li><li>Выполните collectstatic.</li><li>Установите gunicorn и запустите приложение.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №7</h3><p>Вы настроили логирование, Debug Toolbar, исправили N+1, добавили индекс, настроили окружение для продакшена, выполнили collectstatic и запустили через Gunicorn.</p>`}

// ========== ОСНОВНОЙ КОД ==========
let activeTab = "home";
let userAnswers = new Array(testQuestions.length).fill(null);
let testSubmitted = false;

function setActiveNav() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
        const navVal = btn.getAttribute('data-nav');
        if ((navVal === 'home' && activeTab === 'home') || (navVal === 'test' && activeTab === 'test')) btn.classList.add('active');
        else btn.classList.remove('active');
    });
}

function getPrevNext(currentType, currentId) {
    let items = currentType === 'lec' ? lectures.map(l => ({type:'lec',id:l.id,title:l.title})) : practices.map(p => ({type:'prac',id:p.id,title:p.title}));
    const idx = items.findIndex(i => i.id === currentId);
    return { prev: idx > 0 ? items[idx-1] : null, next: idx < items.length-1 ? items[idx+1] : null };
}

function renderNavButtons(currentType, currentId) {
    const { prev, next } = getPrevNext(currentType, currentId);
    return `<div class="nav-buttons">
        ${prev ? `<div class="nav-btn-page" data-nav-type="${prev.type}" data-nav-id="${prev.id}">← Предыдущая: ${prev.title}</div>` : '<div class="nav-btn-page" style="opacity:0.3;">← Предыдущая</div>'}
        <div class="nav-btn-page" data-nav-type="home" data-nav-id="">🏠 На главную</div>
        ${next ? `<div class="nav-btn-page" data-nav-type="${next.type}" data-nav-id="${next.id}">Следующая: ${next.title} →</div>` : '<div class="nav-btn-page" style="opacity:0.3;">Следующая →</div>'}
    </div>`;
}

function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function render() {
    const hash = window.location.hash.slice(1) || 'home';
    const app = document.getElementById('app');
    
    if (hash === 'test') {
        activeTab = 'test';
        setActiveNav();
        const qHtml = testQuestions.map((q, idx) => `<div class="question-block"><div class="question-text">${idx+1}. ${escapeHtml(q.question)}</div><div class="options">${q.options.map((opt, oi) => `<div class="option"><input type="radio" name="q${idx}" value="${oi}" id="q${idx}_${oi}" ${userAnswers[idx] === oi ? 'checked' : ''} ${testSubmitted ? 'disabled' : ''}><label for="q${idx}_${oi}">${escapeHtml(opt)}</label></div>`).join('')}</div></div>`).join('');
        let result = '';
        if (testSubmitted) {
            let correct = testQuestions.reduce((c, q, i) => c + (userAnswers[i] === q.correct ? 1 : 0), 0);
            let percent = Math.round(correct/30*100);
            result = `<div class="result-area">✅ Правильных: ${correct} из 30 (${percent}%)</div>`;
        }
        app.innerHTML = `<div class="test-page"><h1>📝 Тест по Django</h1><p>30 вопросов</p>${qHtml}<div class="test-actions"><button id="checkBtn" class="test-btn">✅ Проверить</button><button id="resetBtn" class="test-btn reset-btn">🔄 Сбросить</button></div>${result}</div>`;
        document.getElementById('checkBtn')?.addEventListener('click', () => { testSubmitted = true; render(); });
        document.getElementById('resetBtn')?.addEventListener('click', () => { userAnswers.fill(null); testSubmitted = false; render(); });
        for (let i = 0; i < testQuestions.length; i++) {
            document.querySelectorAll(`input[name="q${i}"]`).forEach(r => r.addEventListener('change', (e) => { if(!testSubmitted) userAnswers[i] = parseInt(e.target.value); }));
        }
    } 
    else if (hash.startsWith('lec_')) {
        activeTab = 'home';
        setActiveNav();
        const lec = lectures.find(l => l.id === hash);
        if(lec) app.innerHTML = `<div class="page"><div class="back" data-nav-type="home">← ко всем лекциям</div><h1>${escapeHtml(lec.title)}</h1><div class="badge">📘 лекция</div><div class="content">${lec.content}</div><div class="conclusion">${lec.conclusion}</div>${renderNavButtons('lec', hash)}</div>`;
        else app.innerHTML = '<div class="page"><p>Лекция не найдена</p></div>';
    }
    else if (hash.startsWith('prac_')) {
        activeTab = 'home';
        setActiveNav();
        const prac = practices.find(p => p.id === hash);
        if(prac) app.innerHTML = `<div class="page"><div class="back" data-nav-type="home">← ко всем практикам</div><h1>${escapeHtml(prac.title)}</h1><div class="badge">🛠️ практика</div><div class="content">${prac.content}</div><div class="conclusion">${prac.conclusion}</div>${renderNavButtons('prac', hash)}</div>`;
        else app.innerHTML = '<div class="page"><p>Практика не найдена</p></div>';
    }
    else {
        activeTab = 'home';
        setActiveNav();
        app.innerHTML = `<div class="two-columns"><div class="block"><h2>📖 Лекции (1-7)</h2><ul class="list">${lectures.map(l => `<li><a href="#${l.id}">📘 ${escapeHtml(l.title)}</a></li>`).join('')}</ul></div><div class="block"><h2>✍️ Практики (1-7)</h2><ul class="list">${practices.map(p => `<li><a href="#${p.id}">🛠️ ${escapeHtml(p.title)}</a></li>`).join('')}</ul></div></div>`;
    }
    document.querySelectorAll('[data-nav-type]').forEach(el => {
        el.addEventListener('click', (e) => {
            const type = el.getAttribute('data-nav-type');
            const id = el.getAttribute('data-nav-id');
            if (type === 'home') window.location.hash = 'home';
            else if (type === 'lec') window.location.hash = id;
            else if (type === 'prac') window.location.hash = id;
        });
    });
}

document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => window.location.hash = btn.getAttribute('data-nav'));
});
window.addEventListener('hashchange', render);
render();
</script>
<footer>📘 Полный курс Django: 7 лекций + 7 практик + тест</footer>
</body>
</html>
