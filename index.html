const lectures = [
{id:"lec1",title:"Лекция 1: Введение в архитектуру веб-приложений. Место Django в экосистеме Python",
content:`<h2>1.1. Клиент-серверная архитектура как основа веба</h2>
<p>Любое веб-приложение строится вокруг взаимодействия двух сторон: клиента и сервера. Клиент (обычно браузер) инициирует обмен, отправляя запрос. Сервер обрабатывает запрос и возвращает ответ. Эта модель предполагает, что сервер не инициирует соединение самостоятельно, а только реагирует на входящие сообщения.</p>
<p>HTTP (HyperText Transfer Protocol) — основной протокол передачи данных в вебе. Каждый запрос содержит метод, который указывает на тип желаемого действия:</p>
<ul><li>GET — запрос на получение данных. Параметры передаются в строке URL, что делает их видимыми и сохраняемыми в истории. GET не должен изменять состояние сервера.</li>
<li>POST — отправка данных на сервер (например, заполненной формы). Данные передаются в теле запроса, не видны в URL. POST предназначен для операций, которые изменяют состояние (создание, обновление, удаление).</li></ul>
<p>Коды ответов HTTP информируют клиента о результате обработки запроса:</p>
<ul><li>200 (OK) — запрос выполнен успешно.</li><li>301/302 (Redirect) — запрошенный ресурс временно или постоянно находится по другому адресу.</li><li>403 (Forbidden) — сервер понял запрос, но отказывается его выполнять из-за недостатка прав.</li><li>404 (Not Found) — ресурс не найден.</li><li>500 (Internal Server Error) — на сервере произошла необработанная ошибка. Django располагается на стороне сервера и отвечает за приём запросов, выполнение программной логики и формирование ответов.</li></ul>
<h2>1.2. Философия Django и его место среди фреймворков</h2>
<p>Django — это высокоуровневый веб-фреймворк на языке Python, следующий принципу "Batteries included" (с батарейками в комплекте). Это означает, что фреймворк предоставляет готовые решения для большинства типовых задач веб-разработки.</p>
<p>Из коробки Django включает:</p>
<ul><li>Объектно-реляционное отображение (ORM) для работы с базами данных без написания SQL-кода.</li><li>Административную панель, автоматически генерируемую на основе моделей данных.</li><li>Систему маршрутизации URL, связывающую адресные строки с функциями-обработчиками.</li><li>Встроенную систему шаблонов для отделения представления от логики.</li><li>Механизмы аутентификации и авторизации пользователей.</li><li>Защиту от распространённых веб-уязвимостей (CSRF, XSS, SQL-инъекции).</li></ul>
<p>Django часто сравнивают с микрофреймворками (Flask, FastAPI). Разница заключается в степени контроля и объёме предоставляемой функциональности. Микрофреймворки требуют самостоятельного подключения компонентов (базы данных, админки, форм), но дают больше гибкости. Django предлагает жёсткую, но продуктивную структуру, позволяющую быстро создавать сложные проекты.</p>
<h2>1.3. Интерпретатор Python и изоляция окружения</h2>
<p>Для работы с Django требуется интерпретатор Python версии 3.10 или выше. Однако простая установка всех библиотек в глобальное окружение системы приводит к конфликтам: разные проекты могут требовать разных версий одной и той же библиотеки.</p>
<p>Решение этой проблемы — виртуальное окружение (virtual environment). Это изолированная директория, содержащая собственную копию интерпретатора Python и установленных пакетов. Виртуальное окружение активируется перед началом работы над проектом и деактивируется после её завершения. Благодаря этому зависимости проекта не пересекаются с зависимостями других проектов или операционной системы.</p>
<p>Встроенный модуль venv предоставляет инструменты для создания и управления такими окружениями.</p>
<h2>1.4. Структура проекта Django</h2>
<p>Команда создания проекта формирует базовую структуру директорий и файлов. Главные из них:</p>
<ul><li>manage.py — скрипт-утилита для выполнения административных команд (запуск сервера, создание миграций, работа с оболочкой).</li><li>settings.py — центральный файл конфигурации проекта. Содержит настройки базы данных, список установленных приложений, пути к статическим и медиа-файлам, режим отладки (DEBUG) и список разрешённых хостов (ALLOWED_HOSTS).</li><li>urls.py — корневой файл маршрутизации. Определяет, какое представление должно обрабатывать тот или иной URL.</li></ul>
<p>Встроенный сервер разработки, запускаемый через manage.py runserver, предназначен только для локального тестирования. Он не соответствует требованиям безопасности и производительности для эксплуатации в реальных условиях.</p>
<h2>1.5. Управление зависимостями</h2>
<p>Для воспроизводимости окружения принято фиксировать все установленные пакеты и их версии в специальном файле (обычно requirements.txt). Этот файл позволяет другому разработчику или серверу в точности восстановить то же окружение, в котором разрабатывался проект. Данная практика является обязательной для командной разработки и развёртывания приложений.</p>`,
conclusion:`<h3>📌 Выводы по лекции 1</h3><p>Django — мощный фреймворк с принципом "Batteries included", работающий по модели клиент-сервер. Ключевые элементы: HTTP-методы (GET/POST), коды ответов, виртуальные окружения для изоляции проектов. Базовая структура проекта (manage.py, settings.py, urls.py) — фундамент для дальнейшей работы. Обязательно фиксировать зависимости в requirements.txt.</p>`},
// ===================== ЛЕКЦИЯ 2 =====================
{id:"lec2",title:"Лекция 2: Организация кода в Django. Модель MVT",
content:`<h2>2.1. Проект и приложение: иерархия компонентов</h2>
<p>В Django введены два важных понятия: проект и приложение. Проект — это весь веб-сайт в целом. Он содержит глобальные настройки, корневые маршруты и объединяет несколько приложений. Проект не занимается конкретной бизнес-логикой, а скорее координирует работу приложений.</p>
<p>Приложение — это модуль, отвечающий за конкретную функциональность: блог, календарь событий, система комментариев, корзина интернет-магазина. Приложения проектируются так, чтобы быть переиспользуемыми. Хорошо написанное приложение можно скопировать в другой проект, и оно продолжит работать с минимальными изменениями.</p>
<p>Такое разделение позволяет поддерживать порядок в кодовой базе, особенно когда над проектом работает несколько разработчиков. Каждое приложение лежит в своей папке и имеет стандартную структуру: models.py, views.py, admin.py, urls.py, папки templates и static.</p>
<h2>2.2. Архитектура MVT (Model-View-Template)</h2>
<p>Django реализует вариант паттерна MVC (Model-View-Controller), который здесь называется MVT:</p>
<ul><li>Model (Модель) — описывает структуру данных, хранящихся в базе. Модель определяет поля таблицы, отношения между таблицами, методы для работы с данными и бизнес-правила на уровне базы данных.</li><li>View (Представление, вид) — содержит бизнес-логику обработки запроса. Представление получает запрос от клиента, взаимодействует с моделями для получения или изменения данных, подготавливает контекст и передаёт его шаблону. Возвращает представление всегда HTTP-ответ.</li><li>Template (Шаблон) — отвечает за представление данных. Шаблон — это HTML-файл со встроенными специальными тегами и переменными. Он преобразует данные из контекста в финальную HTML-страницу, которую увидит пользователь.</li></ul>
<p>В отличие от классического MVC, где контроллер управляет потоком данных, в Django роль контроллера выполняет сам фреймворк: он анализирует URL, вызывает нужное представление, а представление решает, какие модели задействовать и какой шаблон отрендерить.</p>
<h2>2.3. Маршрутизация URL. Диспетчер и конвертеры</h2>
<p>Маршрутизация (URLconf) — это механизм, который связывает входящий HTTP-запрос с конкретной функцией-представлением. Django обрабатывает URL следующим образом: при запуске проекта фреймворк загружает корневой модуль urls.py, проходится по списку urlpatterns и для каждого пути проверяет, совпадает ли он с началом запрошенного URL. При первом совпадении обработка останавливается, и управление передаётся указанному представлению.</p>
<p>Важная особенность: маршруты организуются иерархически. Приложение может иметь собственный файл urls.py, который подключается к корневому с помощью функции include(). Это позволяет приложению самостоятельно управлять своими URL, не затрагивая глобальную маршрутизацию.</p>
<p>Динамические маршруты позволяют извлекать переменные из самого URL. Например, вместо создания отдельных правил для /posts/1/, /posts/2/, /posts/3/ создаётся один маршрут /posts/<int:post_id>/. Конвертер int преобразует строку из URL в целое число и передаёт его в представление как параметр. Существуют и другие конвертеры: str, slug, uuid, path.</p>
<h2>2.4. Система шаблонов</h2>
<p>Шаблоны в Django служат для генерации HTML. Они не должны содержать сложную бизнес-логику, но допускают простые конструкции для вывода переменных и организации циклов/условий.</p>
<p>Основные элементы языка шаблонов:</p>
<ul><li>Переменные: {{ variable }}. Значение переменной подставляется в том месте, где она написана. Можно обращаться к атрибутам через точку: {{ user.name }}.</li><li>Теги: {% tag %}. Теги управляют логикой шаблона: циклы ({% for %}), условные операторы ({% if %}), включение других шаблонов ({% include %}), загрузка статических файлов ({% load static %}).</li><li>Фильтры: {{ variable|filter }}. Фильтры изменяют значение переменной перед выводом. Примеры: lower (перевод в нижний регистр), truncatechars (обрезка строки до заданного числа символов), date (форматирование даты).</li></ul>
<p>Django ищет шаблоны в специальных директориях, по умолчанию — в папке templates каждого зарегистрированного приложения. Это позволяет приложению инкапсулировать собственные шаблоны.</p>
<h2>2.5. Наследование шаблонов</h2>
<p>Практически каждый сайт имеет повторяющиеся элементы: заголовок, навигационное меню, подвал. Вместо того чтобы копировать одну и ту же разметку на каждую страницу, Django предлагает механизм наследования шаблонов.</p>
<p>Базовый шаблон определяет "скелет" страницы и помечает изменяемые области с помощью тега {% block %}. Дочерний шаблон начинается с тега {% extends %} и затем переопределяет только нужные блоки, оставляя остальную часть базового шаблона без изменений. При рендеринге дочернего шаблона Django сначала загружает базовый, затем подставляет содержимое блоков. Этот подход следует принципу DRY (Don't Repeat Yourself) и существенно упрощает поддержку сайта.</p>
<h2>2.6. Статические файлы</h2>
<p>Статические файлы (CSS, JavaScript, шрифты, изображения, используемые в оформлении) не создаются динамически и не меняются в процессе работы сайта. Django требует, чтобы такие файлы хранились в директории static внутри приложения (или в общих папках, настроенных в проекте).</p>
<p>Для подключения статического файла в шаблоне сначала нужно загрузить специальную библиотеку {% load static %}, затем использовать тег {% static 'путь/к/файлу' %}. Во время разработки при включенном режиме DEBUG Django сам отдаёт статические файлы. В продакшене это должен делать веб-сервер (Nginx, Apache) или CDN, так как Django не рассчитан на эффективную отдачу больших объёмов статики.</p>`,
conclusion:`<h3>📌 Выводы по лекции 2</h3><p>Разделение на проект и приложения обеспечивает модульность и переиспользуемость. MVT — ключевой паттерн Django. Маршрутизация гибкая, поддерживает динамические URL с конвертерами. Система шаблонов с наследованием (extends/block) реализует принцип DRY. Статические файлы требуют отдельной настройки и не должны отдаваться Django в продакшене.</p>`},
// ===================== ЛЕКЦИЯ 3 =====================
{id:"lec3",title:"Лекция 3: Базы данных и объектно-реляционное отображение (ORM)",
content:`<h2>3.1. Модели как описание предметной области</h2>
<p>В реляционных базах данных данные организуются в виде таблиц. Таблица состоит из строк (записей) и столбцов (полей). Каждая строка — это один объект предметной области (например, один пост блога). Каждый столбец — это атрибут объекта (заголовок поста, его содержание, дата создания).</p>
<p>Django позволяет описывать таблицы не на SQL, а на Python с помощью классов, наследующихся от models.Model. Атрибут класса, являющийся экземпляром одного из полей (например, CharField, TextField, DateTimeField), становится столбцом таблицы. Связь между таблицами задаётся специальными полями: ForeignKey, ManyToManyField, OneToOneField.</p>
<p>Каждая модель автоматически получает первичный ключ — поле id, которое уникально идентифицирует каждую запись. Этот ключ создаётся неявно, если явно не указано другое поле в качестве первичного.</p>
<p>Модель — это не просто схема таблицы, но и место для бизнес-логики, связанной с данными. Например, метод __str__ определяет, как объект будет отображаться в административной панели и в отладочных сообщениях. Внутренний класс Meta позволяет задать метаинформацию: сортировку по умолчанию (ordering), понятные имена во множественном и единственном числе (verbose_name, verbose_name_plural).</p>
<h2>3.2. Миграции: эволюция схемы базы данных</h2>
<p>Разработка приложения редко проходит без изменений в структуре данных. Добавляются новые поля, удаляются старые, изменяются типы. Django предлагает механизм миграций для управления этими изменениями.</p>
<p>Миграция — это файл, содержащий описание того, как изменить схему базы данных (создать таблицу, добавить столбец, удалить индекс). Миграции создаются из текущего состояния моделей командой makemigrations. При этом Django сравнивает текущее состояние моделей с последней применённой миграцией и генерирует только необходимые изменения.</p>
<p>Сами миграции применяются к базе данных командой migrate. Эта команда выполняет по очереди все неприменённые миграции, фиксируя выполнение в специальной таблице django_migrations.</p>
<p>Процесс работы с миграциями всегда однонаправлен: изменения вносятся в модели → создаётся миграция → миграция применяется. Никогда не следует редактировать миграции вручную и удалять их без необходимости, особенно если они уже были применены к рабочей базе данных.</p>
<p>Важное различие: makemigrations не трогает базу данных, он только создаёт файлы описаний. migrate уже выполняет SQL-запросы к реальной БД.</p>
<h2>3.3. Объектно-реляционное отображение (ORM)</h2>
<p>ORM — это слой, который преобразует строки базы данных в объекты Python и обратно. Вместо написания SQL-запросов разработчик взаимодействует с моделями через менеджер объектов (objects), доступный у каждого класса модели.</p>
<p>Базовые операции (CRUD):</p>
<ul><li>Create (создание) — новый объект создаётся либо конструктором с последующим вызовом save(), либо через метод create() менеджера, который объединяет оба действия.</li><li>Read (чтение) — метод all() возвращает все записи таблицы в виде QuerySet (коллекции, похожей на список). Метод filter() отбирает записи по условию. Метод get() возвращает одну запись и выбрасывает исключение, если такой записи нет или их несколько.</li><li>Update (обновление) — объект извлекается из базы, его поля изменяются в памяти, затем вызывается save(). Для массового обновления нескольких записей используется метод update() на QuerySet.</li><li>Delete (удаление) — вызывается метод delete() у объекта или у QuerySet.</li></ul>
<p>Важно понимать, что QuerySet ленив (lazy). Фактический запрос к базе данных происходит только в момент, когда QuerySet итерируется, преобразуется в список или вызывается его метод exists(), count().</p>
<h2>3.4. Связи между таблицами</h2>
<p>Реальные проекты редко ограничиваются одной таблицей. Типичные отношения между данными:</p>
<ul><li>Один ко многим (ForeignKey) — один объект ссылается на другой. Пример: один пост может иметь много комментариев, но каждый комментарий принадлежит одному посту. Поле ForeignKey хранит на своей стороне идентификатор связанного объекта.</li><li>Многие ко многим (ManyToManyField) — объекты связаны неограниченно с обеих сторон. Пример: книга и автор — один автор может написать много книг, и у одной книги может быть много авторов. Django создаёт промежуточную таблицу для хранения связей.</li><li>Один к одному (OneToOneField) — расширение модели. Пример: профиль пользователя содержит дополнительные поля, не входящие в стандартную модель пользователя.</li></ul>
<p>Параметр on_delete для внешних ключей определяет, что должно произойти при удалении связанного объекта. Например, CASCADE удалит все зависимые объекты, PROTECT запретит удаление, если на объект есть ссылки.</p>`,
conclusion:`<h3>📌 Выводы по лекции 3</h3><p>Модели — Python-классы, отображаемые на таблицы БД. Миграции (makemigrations/migrate) позволяют безопасно эволюционировать схему. ORM предоставляет CRUD-операции без SQL, но требует понимания ленивости QuerySet. Связи между таблицами (ForeignKey, ManyToManyField, OneToOneField) с параметром on_delete обеспечивают целостность данных.</p>`},
// ===================== ЛЕКЦИЯ 4 =====================
{id:"lec4",title:"Лекция 4: Автоматическая административная панель. Инструмент для управления контентом",
content:`<h2>4.1. Архитектура и назначение Django Admin</h2>
<p>Административная панель — одно из ключевых преимуществ Django. Это полноценный веб-интерфейс, автоматически генерируемый на основе зарегистрированных моделей. Панель доступна по пути /admin/ и предназначена для авторизованных пользователей с правом staff (персонал) или superuser (суперадминистратор).</p>
<p>Из коробки админка предоставляет:</p>
<ul><li>Просмотр списка записей для каждой модели.</li><li>Добавление новых записей через форму, поля которой соответствуют полям модели.</li><li>Редактирование и удаление существующих записей.</li><li>Поиск и фильтрацию (после настройки).</li><li>Управление пользователями и группами с разграничением прав.</li></ul>
<p>Админка не генерируется магическим образом: она использует те же модели, формы и представления, которые доступны разработчику. Это означает, что её поведение можно переопределять почти на любом уровне.</p>
<h2>4.2. Регистрация моделей</h2>
<p>По умолчанию в админке отображаются только две встроенные модели: User (пользователи) и Group (группы). Все пользовательские модели необходимо зарегистрировать в файле admin.py приложения. Простейшая регистрация — вызов admin.site.register(MyModel). После этого модель появляется в админке, и с ней можно работать через стандартные формы и списки.</p>
<p>Однако стандартные список и форма часто неудобны. Например, в списке записей отображается только результат метода __str__ модели, что недостаточно для быстрой навигации. Форма показывает все поля в том порядке, в котором они объявлены в модели, без группировки.</p>
<h2>4.3. Кастомизация отображения списка</h2>
<p>Для тонкой настройки создаётся класс, наследующий от ModelAdmin. В этом классе можно задать следующие атрибуты:</p>
<ul><li>list_display — кортеж из имён полей, которые должны отображаться в списке в виде колонок. Можно выводить не только поля модели, но и методы модели или методы самого ModelAdmin.</li><li>list_filter — поля, по которым справа будут появляться фильтры. Django автоматически создаёт подходящие интерфейсы: выпадающие списки для выбора из набора значений, иерархические фильтры для дат.</li><li>search_fields — поля, по которым будет работать глобальная строка поиска. Поиск выполняется с помощью оператора LIKE (регистронезависимый полнотекстовый поиск не поддерживается из коробки).</li><li>ordering — сортировка по умолчанию.</li><li>list_per_page — количество записей на странице (пагинация).</li></ul>
<p>После того как класс ModelAdmin создан, он передаётся вторым параметром в admin.site.register() или используется в виде декоратора @admin.register().</p>
<h2>4.4. Настройка формы редактирования</h2>
<p>Форму добавления и редактирования записи также можно настраивать:</p>
<ul><li>fields — просто список полей в том порядке, в котором они должны выводиться.</li><li>fieldsets — более продвинутая группировка. Позволяет разбить форму на несколько логических блоков, некоторые из которых можно сворачивать (параметр classes: ('collapse',)).</li><li>prepopulated_fields — указывает, какие поля должны автоматически заполняться на основе других. Чаще всего используется для поля slug, которое генерируется из заголовка транслитерацией.</li></ul>
<h2>4.5. Действия над группой записей</h2>
<p>По умолчанию в админке есть действие "Удалить выбранные записи". Разработчик может добавить собственные действия. Действие — это функция, которая принимает запрос, QuerySet выбранных объектов и выполняет над ними массовую операцию (например, опубликовать, перенести в архив, присвоить категорию). Действие регистрируется в ModelAdmin через атрибут actions.</p>
<p>Важное ограничение: массовые действия по умолчанию не вызывают методы save() для каждого объекта, поэтому не срабатывают сигналы и не выполняются валидации, связанные с отдельными объектами. Это сделано ради производительности.</p>
<h2>4.6. Ограничение доступа и прав</h2>
<p>Админка уважает систему прав доступа Django. Если пользователь не имеет права на добавление, изменение или удаление объектов определённой модели, соответствующие кнопки и действия будут скрыты. Разработчик может переопределить методы has_view_permission, has_add_permission, has_change_permission, has_delete_permission в классе ModelAdmin для реализации нестандартной логики доступа (например, редактор может редактировать только свои посты).</p>`,
conclusion:`<h3>📌 Выводы по лекции 4</h3><p>Django Admin — мощный инструмент для управления контентом. Регистрация моделей через admin.site.register() или @admin.register(). Кастомизация через ModelAdmin: list_display (колонки), list_filter (фильтры), search_fields (поиск), fieldsets (группировка полей), prepopulated_fields (автозаполнение slug). Действия (actions) позволяют выполнять массовые операции. Система прав доступа гибко настраивается.</p>`}
];
// ===================== ЛЕКЦИЯ 5 =====================
{id:"lec5",title:"Лекция 5: Формы и приём данных от пользователя",
content:`<h2>5.1. Проблема обработки пользовательского ввода</h2>
<p>Работа с данными, полученными от пользователя, — одна из самых ответственных областей веб-разработки. Пользователь может отправить что угодно: отсутствующие значения, данные неверного типа, гигантские объёмы текста, вредоносный HTML/JavaScript (XSS-атака), SQL-код, специально сформированные данные для обхода логики.</p>
<p>Ручная обработка каждого поля (проверка наличия, типа, диапазона, безопасность, приведение типов) приводит к огромному объёму дублирующегося кода. Django Forms решают эту проблему, автоматизируя:</p>
<ul><li>Генерацию HTML-полей.</li><li>Первичную очистку и преобразование данных.</li><li>Валидацию на основе правил, заданных в форме.</li><li>Повторное отображение формы с сообщениями об ошибках.</li></ul>
<h2>5.2. Два типа форм: Form и ModelForm</h2>
<p>В Django существует два базовых класса для построения форм:</p>
<ul><li>forms.Form — независимая форма, не привязанная к модели данных. Используется, когда данные не сохраняются напрямую в базу (например, форма поиска, форма обратной связи, форма подписки).</li><li>forms.ModelForm — форма, автоматически создаваемая на основе модели. Django выводит поля из модели, учитывая их типы, валидаторы и ограничения. После валидации модель может быть сохранена одним вызовом save().</li></ul>
<p>ModelForm значительно сокращает код, особенно для типовых CRUD-операций. Внутренний класс Meta указывает, на какой модели основана форма и какие поля из этой модели должны присутствовать (можно исключить поля с помощью exclude).</p>
<h2>5.3. Жизненный цикл обработки формы</h2>
<p>Типичная обработка формы в представлении включает следующие этапы:</p>
<ol><li>Определить тип запроса: GET (показать пустую форму) или POST (обработать данные).</li><li>Для POST-запроса создать экземпляр формы, передав в него request.POST (и, возможно, request.FILES для файлов).</li><li>Вызвать метод is_valid(). Он запускает валидацию всех полей. Если валидация пройдена, данные становятся доступны в form.cleaned_data.</li><li>При успешной валидации выполнить действие (сохранить модель, отправить письмо, обновить сессию) и выполнить редирект (паттерн Post/Redirect/Get, предотвращающий повторную отправку формы при обновлении страницы).</li><li>Если форма невалидна, вернуть ответ с той же формой, но уже с заполненными данными и ошибками. Шаблон должен вывести эти ошибки рядом с полями.</li></ol>
<p>Важное замечание: метод is_valid() не только возвращает булево значение, но и наполняет форму ошибками и очищенными данными.</p>
<h2>5.4. Валидация: уровни и механизмы</h2>
<p>Валидация в Django Forms проходит несколько уровней:</p>
<ol><li>Валидация поля — для каждого типа поля есть свой набор встроенных валидаторов. Например, CharField проверяет, что значение не превышает max_length; EmailField — что переданная строка похожа на email.</li><li>Метод clean_&lt;fieldname&gt; — если нужна дополнительная валидация конкретного поля с доступом к уже очищенному значению. Этот метод должен вернуть очищенное значение или выбросить ValidationError.</li><li>Метод clean формы — вызывается после всех полей. Используется для валидации, требующей одновременного доступа к нескольким полям (например, проверка, что пароль и подтверждение пароля совпадают).</li><li>В случае ModelForm — валидация на уровне модели и её полей также запускается при вызове is_valid().</li></ol>
<p>Все ошибки накапливаются и могут быть выведены в шаблоне как общие (form.non_field_errors) или привязанные к конкретному полю (form.field_name.errors).</p>
<h2>5.5. Защита от подделки межсайтовых запросов (CSRF)</h2>
<p>Атака CSRF заключается в том, что злоумышленник заставляет браузер жертвы отправить запрос на сайт, где жертва уже аутентифицирована (например, перейти по специально созданной ссылке). Чтобы предотвратить это, Django требует наличия в каждом POST-запросе уникального токена, который привязан к сессии пользователя.</p>
<p>В шаблоне для формы этот токен вставляется тегом {% csrf_token %}. Django автоматически проверяет наличие и корректность токена в каждом входящем POST-запросе (кроме специально помеченных декоратором @csrf_exempt). Если токен отсутствует или неверен, запрос отклоняется с кодом 403.</p>
<p>CSRF-защита — встроенный механизм, не требующий дополнительных действий со стороны разработчика, кроме добавления {% csrf_token %} в каждую HTML-форму.</p>
<h2>5.6. Отображение формы в шаблоне</h2>
<p>Django предоставляет несколько способов вывести форму в шаблоне:</p>
<ul><li>{{ form.as_p }} — каждое поле в отдельном абзаце (&lt;p&gt;).</li><li>{{ form.as_table }} — каждое поле в строке таблицы (&lt;tr&gt;).</li><li>{{ form.as_ul }} — каждое поле в элементе списка (&lt;li&gt;).</li><li>Ручной перебор полей через {% for field in form %} — для тонкого контроля разметки.</li><li>Обращение к конкретному полю: {{ form.field_name }}.</li></ul>
<p>Рядом с полем можно вывести его ошибки ({{ field.errors }}), метку ({{ field.label }}), описание ({{ field.help_text }}).</p>`,
conclusion:`<h3>📌 Выводы по лекции 5</h3><p>Формы Django автоматизируют работу с пользовательским вводом. ModelForms тесно связаны с моделями. Жизненный цикл формы (GET/POST/is_valid) стандартен. Несколько уровней валидации обеспечивают безопасность. Обязательная CSRF-защита через тег {% csrf_token %}.</p>`},
// ===================== ЛЕКЦИЯ 6 =====================
{id:"lec6",title:"Лекция 6: Работа с медиа-файлами. Изображения и документы",
content:`<h2>6.1. Отличие статических от медиа-файлов</h2>
<p>В контексте Django важно различать:</p>
<ul><li>Статические файлы являются частью самого приложения: CSS-стили, клиентские JavaScript-скрипты, шрифты, изображения интерфейса. Они не меняются пользователями и одинаковы для всех экземпляров приложения. Статика управляется через django.contrib.staticfiles.</li><li>Медиа-файлы создаются и загружаются пользователями: аватары, фотографии товаров, прикрепляемые документы, видео. Медиа уникальны для каждого пользователя и для каждой записи. Они требуют другого подхода к хранению и правам доступа.</li></ul>
<p>Django разделяет эти два потока и требует разных настроек: STATIC_URL / STATIC_ROOT для статики и MEDIA_URL / MEDIA_ROOT для медиа.</p>
<h2>6.2. Настройка хранения медиа-файлов</h2>
<p>Для работы с медиа необходимо определить две переменные в settings.py:</p>
<ul><li>MEDIA_URL — префикс URL, по которому медиа-файлы будут доступны. Например, /media/.</li><li>MEDIA_ROOT — абсолютный путь к директории на диске, где эти файлы будут храниться. Рекомендуется использовать BASE_DIR / 'media'.</li></ul>
<p>В режиме разработки (DEBUG=True) Django может отдавать медиа-файлы через встроенный сервер. Для этого в корневой urls.py добавляется специальная строчка, которая работает только при отладке. В продакшене медиа-файлы должен отдавать веб-сервер (Nginx, Apache) или внешнее облачное хранилище (Amazon S3, Yandex Cloud), так как Django не спроектирован для эффективной раздачи больших потоков данных.</p>
<h2>6.3. Модели с файловыми полями</h2>
<p>Django предоставляет два основных типа полей для хранения файлов:</p>
<ul><li>FileField — для хранения любых файлов (документы, архивы, исполняемые файлы).</li><li>ImageField — специализированный подтип FileField, который дополнительно проверяет, что загруженный файл является изображением (благодаря библиотеке Pillow) и предоставляет атрибуты для работы с размерами и геометрией.</li></ul>
<p>Поле upload_to определяет подпапку внутри MEDIA_ROOT, куда будет сохранён файл. Он может быть простой строкой или функцией, которая возвращает путь в зависимости от объекта и оригинального имени файла. Это полезно для организации иерархии: например, upload_to='posts/%Y/%m/%d' сохранит файл в папку вида posts/2025/03/15.</p>
<p>Оригинальное имя файла, отправленное браузером, не сохраняется — Django генерирует новое имя, чтобы избежать конфликтов. При необходимости можно кастомизировать генерацию имени, переопределив поведение файловой системы хранения.</p>
<h2>6.4. Обработка загруженных файлов в формах</h2>
<p>Чтобы форма принимала файлы, HTML-тег &lt;form&gt; должен иметь атрибут enctype="multipart/form-data". В представлении файлы передаются не через request.POST, а через request.FILES.</p>
<p>При использовании ModelForm с полем ImageField или FileField достаточно включить это поле в список fields. Django сам обработает загрузку: прочитает файл из request.FILES, сохранит его в MEDIA_ROOT по пути, сгенерированному upload_to, и запишет относительный путь в базу данных.</p>
<p>Важно: если в форме есть файловое поле, при инициализации формы из POST-запроса нужно передать два аргумента: request.POST и request.FILES. Иначе файлы не будут обработаны.</p>
<h2>6.5. Ограничение размера, типа и безопасности</h2>
<p>Django не ограничивает размер загружаемого файла по умолчанию — это делает веб-сервер. Однако можно добавить ограничение в валидации формы. Для проверки типа файла недостаточно полагаться на расширение в имени файла (его легко подделать). Более надёжно — проверять Content-Type из request.FILES или использовать специальные библиотеки, анализирующие сигнатуру файла (магические числа).</p>
<p>Дополнительные соображения безопасности:</p>
<ul><li>Загруженные файлы не должны выполняться на сервере как скрипты (PHP, Python, CGI).</li><li>Файлы не должны сохраняться с исходными именами, чтобы злоумышленник не мог угадать путь к файлу другого пользователя.</li><li>Рекомендуется хранить файлы за пределами директории, доступной для прямой загрузки, и отдавать их через отдельное представление с проверкой прав.</li></ul>
<h2>6.6. Создание миниатюр и оптимизация изображений</h2>
<p>Стандартный ImageField не создаёт миниатюры автоматически. Однако существует популярная библиотека sorl-thumbnail, которая генерирует уменьшенные копии изображений при первом запросе и кеширует их. Миниатюры ускоряют загрузку страниц (особенно на мобильных устройствах), экономят трафик и место на диске.</p>
<p>Альтернативный подход — использовать django-resized или выполнять ресайз изображений непосредственно в модели, переопределив метод save(). Это гарантирует, что даже исходное изображение не будет слишком большим, но требует больше кода.</p>`,
conclusion:`<h3>📌 Выводы по лекции 6</h3><p>Медиа-файлы требуют отдельных настроек (MEDIA_URL/MEDIA_ROOT) и не должны отдаваться Django в продакшене. ImageField и ImageField требуют библиотеки Pillow. upload_to организует хранение. Формы с файлами требуют enctype и request.FILES. Важно валидировать размер и тип файлов. Миниатюры создаются через sorl-thumbnail или ресайз в модели.</p>`},
// ===================== ЛЕКЦИЯ 7 =====================
{id:"lec7",title:"Лекция 7: Отладка, оптимизация и деплой Django-приложений",
content:`<h2>7.1. Уровни логирования и вывод отладочной информации</h2>
<p>В процессе разработки часто требуется отслеживать ход выполнения программы, значения переменных, возникающие ошибки. Простой вывод через print() имеет ограничения: в продакшене такие сообщения никуда не записываются, могут попасть в ответ клиенту и нарушить формат данных. Более правильный подход — использовать модуль logging из стандартной библиотеки Python.</p>
<p>Логирование строится на четырёх компонентах:</p>
<ul><li>Логгер — точка входа, у которой вызываются методы debug(), info(), warning(), error(), critical().</li><li>Обработчик (handler) — определяет, куда отправляются записи (консоль, файл, системный журнал, удалённый сервер).</li><li>Форматтер (formatter) — задаёт структуру записи: дата, уровень, имя логгера, сообщение.</li><li>Фильтр (filter) — позволяет отбирать, какие записи обрабатывать.</li></ul>
<p>Django предварительно настраивает базовое логирование для запросов и ошибок. Разработчик может расширить эту конфигурацию через словарь LOGGING в settings.py. Рекомендуется создать отдельные логгеры для своих модулей, чтобы управлять уровнем детализации независимо.</p>
<h2>7.2. Отладка запросов и анализ производительности</h2>
<p>Одна из частых проблем в веб-приложениях — медленная работа из-за избыточного количества запросов к базе данных. Django Debug Toolbar — это подключаемая панель, которая отображает:</p>
<ul><li>Все выполненные SQL-запросы, их текст и время выполнения (с подсветкой дублирующихся и медленных).</li><li>Содержимое кеша, если он используется.</li><li>Время обработки запроса, разделённое на этапы (запрос БД, рендеринг шаблонов, прочее).</li><li>Заголовки запроса и ответа.</li><li>Используемые настройки.</li></ul>
<p>Панель работает только в режиме разработки (DEBUG=True). Она не должна быть включена в продакшене, так как раскрывает детали внутреннего устройства приложения и замедляет работу.</p>
<h2>7.3. Проблема N+1 запроса и способы её решения</h2>
<p>Типичная анти-паттерна в работе с ORM — ситуация, когда сначала запрашивается список объектов (один запрос), а затем в цикле для каждого объекта выполняется ещё один запрос для получения связанных данных. Итоговое количество запросов равно 1 + N, где N — количество объектов в списке. При 100 постах это может дать 101 запрос — катастрофически медленно.</p>
<p>Django предлагает два метода для решения этой проблемы:</p>
<ul><li>select_related() — выполняет SQL-соединение (JOIN) и выбирает данные из связанной таблицы одним запросом. Работает для отношений "один к одному" и "один ко многим" (когда нужны данные только с одной внешней таблицы).</li><li>prefetch_related() — выполняет отдельные запросы для каждой связанной таблицы, а затем объединяет результаты на уровне Python. Работает для отношений "многие ко многим" и обратных связей.</li></ul>
<p>Использование этих методов не всегда очевидно, но анализ панели инструментов или включение логирования всех запросов позволяет быстро выявить N+1 проблему.</p>
<h2>7.4. Настройки перед выкаткой в продакшен</h2>
<p>Переход от разработки к эксплуатации требует изменения ряда настроек:</p>
<ul><li>DEBUG = False — выключает подробные страницы ошибок, раскрывающие исходный код и настройки. Вместо этого Django показывает стандартные страницы 404, 500.</li><li>ALLOWED_HOSTS — список доменных имён, на которых приложение должно отвечать. Обязательная настройка при выключенном DEBUG; иначе Django отклонит любой запрос.</li><li>SECRET_KEY — секретный ключ, используемый для криптографических подписей. В разработке он часто захардкожен в коде, в продакшене должен быть вынесен в переменные окружения (не попадать в репозиторий).</li><li>Настройка статики: команда collectstatic собирает все статические файлы из всех приложений в единую директорию, указанную в STATIC_ROOT. Эту директорию должен обслуживать веб-сервер.</li><li>Настройка медиа: как уже обсуждалось, медиа-файлы не отдаются Django в продакшене.</li></ul>
<h2>7.5. Подходы к развёртыванию (без глубокой детализации)</h2>
<p>Развёртывание (деплой) — это процесс переноса приложения на сервер, где оно будет доступно публично. Минимальный стек для Django в продакшене включает:</p>
<ul><li>WSGI-сервер (например, Gunicorn или uWSGI) — принимает запросы от веб-сервера, запускает Django-приложение и возвращает ответ.</li><li>HTTP-сервер (Nginx или Apache) — стоит перед WSGI-сервером. Отдаёт статические и медиа-файлы, проксирует динамические запросы к WSGI-серверу, обрабатывает кеширование, SSL-сертификаты.</li><li>База данных — для проектов с небольшой нагрузкой может оставаться SQLite, но для серьёзных проектов переходят на PostgreSQL или MySQL (требуют отдельной установки настройки).</li></ul>
<p>Процесс деплоя вручную сложен и подвержен ошибкам. В реальной работе используются инструменты автоматизации: Docker, Ansible, CI/CD-конвейеры (GitHub Actions, GitLab CI), специализированные PaaS-платформы (Heroku, PythonAnywhere, Yandex Cloud).</p>`,
conclusion:`<h3>📌 Выводы по лекции 7</h3><p>Логирование (logging) предпочтительнее print(). Django Debug Toolbar помогает находить узкие места. Проблема N+1 решается через select_related() и prefetch_related(). Перед деплоем обязательно: DEBUG=False, ALLOWED_HOSTS, SECRET_KEY в .env, collectstatic. В продакшене используют Gunicorn + Nginx + PostgreSQL.</p>`}
];

{id:"pr2",title:"Практика №2. Маршруты, представления, шаблоны",
content:`<ol><li>В уже существующем проекте mynews создайте новое приложение с именем posts.</li><li>Зарегистрируйте приложение posts в INSTALLED_APPS.</li><li>В файле views.py приложения posts создайте функцию index, которая возвращает HttpResponse с текстом «Страница новостей».</li><li>Создайте в приложении posts файл urls.py.</li><li>Добавьте в urlpatterns маршрут для пустого пути, ведущий на представление index. Дайте маршруту имя home.</li><li>В корневом urls.py проекта подключите маршруты приложения posts с помощью include. Используйте префикс posts/.</li><li>Запустите сервер и перейдите по адресу http://127.0.0.1:8000/posts/. Убедитесь, что видите нужный текст.</li><li>Добавьте второе представление about, возвращающее HttpResponse с текстом «О проекте».</li><li>Пропишите маршрут for about/ в приложении posts. Дайте имя about.</li><li>Перейдите в браузере на /posts/about/. Убедитесь, что страница открывается.</li><li>Создайте третье представление post_detail, которое принимает параметр post_id.</li><li>Представление должно возвращать HttpResponse с текстом «Вы смотрите пост номер Х», где Х — переданный идентификатор.</li><li>Добавьте динамический маршрут post/&lt;int:post_id&gt;/ и дайте имя post_detail.</li><li>Перейдите на /posts/post/42/. Убедитесь, что видите правильный номер.</li><li>Внутри приложения posts создайте папку templates, а внутри неё папку posts.</li><li>Создайте файл base.html в папке templates/posts. Напишите базовую HTML-структуру с блоком content.</li><li>Создайте файл index.html, расширяющий base.html. В блоке content напишите «Добро пожаловать на сайт новостей».</li><li>Измените представление index так, чтобы оно использовало render с шаблоном posts/index.html.</li><li>Перезагрузите страницу /posts/. Убедитесь, что теперь отображается HTML, а не просто текст.</li><li>Создайте шаблон about.html, расширяющий base.html. Напишите произвольный текст о сайте.</li><li>Измените представление about на рендер шаблона posts/about.html.</li><li>В шаблоне index.html создайте ссылку на страницу about с использованием тега url и имени about.</li><li>В шаблоне index.html создайте ссылку на детальную страницу поста с post_id=1, используя имя post_detail.</li><li>Внутри приложения posts создайте папку static, а внутри неё папку posts и файл style.css.</li><li>В style.css напишите правило, которое меняет цвет заголовка h1 на синий.</li><li>В базовом шаблоне base.html загрузите статические файлы с помощью {% load static %}.</li><li>Подключите style.css в base.html с помощью тега link и хелпера static.</li><li>Убедитесь, что заголовок на всех страницах стал синим.</li><li>Добавьте в base.html блок title, а в дочерних шаблонах переопределите его, задавая разные заголовки для разных страниц.</li><li>Проверьте, что вкладки браузера для разных страниц показывают разные названия.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №2</h3><p>Вы научились создавать приложения, настраивать маршрутизацию (включая динамические маршруты с конвертерами), работать с шаблонами и наследованием (base.html, extends, block). Подключили статические файлы (CSS) и использовали тег url для построения ссылок по именам маршрутов.</p>`},
{id:"pr3",title:"Практика №3. Модели, миграции, ORM",
content:`<ol><li>В приложении posts откройте файл models.py.</li><li>Создайте модель Post с полями title (CharField, максимальная длина 200), content (TextField), published_date (DateTimeField с auto_now_add=True), is_published (BooleanField со значением по умолчанию False).</li><li>Добавьте в модель метод __str__, который возвращает значение поля title.</li><li>Добавьте внутренний класс Meta с атрибутом ordering = ['-published_date'].</li><li>Выполните команду makemigrations. Убедитесь, что создан файл миграции.</li><li>Выполните команду migrate. Убедитесь, что таблица создана в базе данных.</li><li>Добавьте в модель поле slug (SlugField с unique=True и max_length=200).</li><li>Создайте новую миграцию для добавления поля slug.</li><li>Примените миграцию. Обратите внимание, что Django запросит значение для существующих записей (их пока нет, поэтому проблем не будет).</li><li>Запустите оболочку Django с помощью python manage.py shell.</li><li>Импортируйте модель Post из вашего приложения.</li><li>Создайте первый объект Post с помощью метода create. title = «Первый пост», slug = «pervyy-post», content = «Текст первого поста».</li><li>Создайте второй объект Post. title = «Второй пост», slug = «vtoroy-post», is_published = True.</li><li>Получите все объекты Post с помощью Post.objects.all(). Выведите их на экран.</li><li>Отфильтруйте опубликованные посты с помощью Post.objects.filter(is_published=True). Сколько их?</li><li>Получите один пост по slug = «pervyy-post» с помощью Post.objects.get(slug='pervyy-post').</li><li>Измените заголовок этого поста на «Первый пост (изменённый)» и сохраните.</li><li>Удалите второй пост с помощью метода delete().</li><li>Убедитесь, что Post.objects.all() возвращает только один пост.</li><li>Выйдите из оболочки Django.</li><li>В представлении index измените код так, чтобы он получал все посты из базы данных и передавал их в шаблон через контекст.</li><li>В шаблоне index.html добавьте цикл {% for post in posts %}, который выводит заголовок каждого поста и дату публикации.</li><li>Добавьте условие {% if post.is_published %}, чтобы отмечать опубликованные посты зелёным цветом.</li><li>В шаблоне index.html создайте ссылку на детальную страницу поста, используя post.slug в параметре.</li><li>В представлении post_detail напишите код, который получает пост по параметру slug (не post_id).</li><li>Если пост не найден, возвращайте HttpResponse с текстом «Пост не найден» и статусом 404.</li><li>Создайте шаблон post_detail.html, расширяющий base.html. Выведите в нём заголовок поста, дату публикации и содержимое.</li><li>В шаблоне post_detail.html добавьте фильтр linebreaks для поля content, чтобы переносы строк превращались в абзацы.</li><li>Добавьте в представление post_detail обработку случая, когда пост не опубликован (is_published = False). В этом случае тоже возвращайте 404.</li><li>Проверьте в браузере страницы списка постов и детальные страницы для существующего и несуществующего slug.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №3</h3><p>Вы создали модель Post, выполнили миграции. Освоили CRUD-операции через ORM в оболочке Django: create, all, filter, get, update, delete. Интегрировали модели с представлениями и шаблонами: передача постов в контекст, циклы, условия. Реализовали детальную страницу по slug с обработкой 404.</p>`},
{id:"pr4",title:"Практика №4. Административная панель",
content:`<ol><li>Создайте суперпользователя с помощью команды createsuperuser.</li><li>Запустите сервер и перейдите в административную панель по адресу /admin.</li><li>Войдите с созданными учётными данными.</li><li>Найдите в админке раздел с моделью Post. Он должен появиться автоматически, если модель зарегистрирована? Нет, пока не зарегистрирована. Убедитесь, что раздела Posts нет.</li><li>В файле admin.py приложения posts импортируйте модель Post.</li><li>Зарегистрируйте модель с помощью admin.site.register(Post).</li><li>Обновите страницу админки. Теперь раздел Posts должен появиться.</li><li>Перейдите в раздел Posts и посмотрите список постов. Какие поля отображаются в списке?</li><li>Добавьте новый пост через админку. Заполните title, slug, content, отметьте is_published.</li><li>Добавьте ещё два любых поста.</li><li>Отредактируйте один из постов, изменив его заголовок.</li><li>Удалите один пост через админку.</li><li>Создайте класс PostAdmin, наследующий от admin.ModelAdmin.</li><li>Добавьте в этот класс атрибут list_display = ('id', 'title', 'published_date', 'is_published').</li><li>Зарегистрируйте модель Post с классом PostAdmin вместо простой регистрации.</li><li>Обновите страницу списка постов в админке. Теперь должны отображаться колонки id, title, published_date, is_published.</li><li>Добавьте в PostAdmin атрибут list_filter = ('is_published', 'published_date').</li><li>Убедитесь, что справа появились фильтры.</li><li>Добавьте атрибут search_fields = ('title', 'content').</li><li>Убедитесь, что строка поиска появилась над списком.</li><li>Добавьте атрибут list_display_links = ('title',). Теперь по заголовку можно перейти к редактированию.</li><li>Добавьте атрибут list_per_page = 5. Создайте несколько постов и убедитесь, что пагинация работает.</li><li>Добавьте в PostAdmin атрибут prepopulated_fields = {'slug': ('title',)}.</li><li>Перейдите на форму добавления нового поста. Убедитесь, что slug заполняется автоматически при вводе заголовка.</li><li>Добавьте в PostAdmin атрибут fields = ('title', 'slug', 'content', 'is_published', 'published_date').</li><li>Обратите внимание, что published_date стало редактируемым. Это не всегда удобно. Уберите его из fields.</li><li>Вместо fields используйте fieldsets. Создайте две группы: «Основное» с полями title, slug, content и «Публикация» с полем is_published.</li><li>Добавьте во вторую группу параметр classes = ('collapse'). Убедитесь, что группа сворачивается.</li><li>Создайте кастомное действие в админке: функцию make_published, которая устанавливает is_published = True для выбранных постов.</li><li>Добавьте это действие в PostAdmin в атрибут actions. Проверьте его работу: выберите несколько постов и примените действие.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №4</h3><p>Вы создали суперпользователя, зарегистрировали модель в админке. Настроили отображение списка (list_display, list_filter, search_fields, list_per_page). Настроили форму редактирования (fieldsets, prepopulated_fields). Добавили кастомное действие make_published. Админка стала удобным инструментом управления контентом.</p>`}
];
// ===================== ПРАКТИКА №5 =====================
{id:"pr5",title:"Практика №5. Формы и приём данных от пользователя",
content:`<ol><li>Создайте в приложении posts файл forms.py.</li><li>Создайте модель Comment с полями post (ForeignKey к Post, on_delete=CASCADE), author_name (CharField, max_length=100), text (TextField), created_at (DateTimeField с auto_now_add=True).</li><li>Выполните makemigrations и migrate.</li><li>Зарегистрируйте модель Comment в админке.</li><li>В forms.py создайте форму CommentForm как ModelForm для модели Comment.</li><li>В Meta-классе укажите model = Comment и fields = ['author_name', 'text'].</li><li>В представлении post_detail добавьте обработку формы комментария.</li><li>Если метод POST, создайте экземпляр CommentForm с request.POST.</li><li>Если форма валидна, создайте комментарий с commit=False, присвойте полю post текущий пост, затем сохраните.</li><li>После сохранения выполните редирект на ту же детальную страницу.</li><li>Если метод GET, создайте пустую форму CommentForm.</li><li>Передайте форму в контекст шаблона post_detail.html под именем comment_form.</li><li>В шаблоне post_detail.html ниже содержимого поста добавьте HTML-форму с method="post".</li><li>Добавьте в форму тег {% csrf_token %}.</li><li>Выведите поле author_name и text с помощью {{ form.as_p }}.</li><li>Добавьте кнопку отправки.</li><li>Проверьте, что комментарии сохраняются в базу данных.</li><li>В шаблоне post_detail.html выведите список всех комментариев к посту. Используйте post.comment_set.all или related_name.</li><li>Для каждого комментария выведите author_name, created_at и text.</li><li>Добавьте в форму валидацию поля author_name: оно не должно содержать цифры.</li><li>Реализуйте это через метод clean_author_name в форме.</li><li>Проверьте, что при вводе имени с цифрами форма не отправляется и показывает ошибку.</li><li>Добавьте в форму валидацию на уровне clean: если поле text содержит слово «спам», форма невалидна.</li><li>Убедитесь, что общая ошибка отображается в шаблоне через form.non_field_errors.</li><li>В представлении post_detail добавьте проверку: если пост не опубликован, не показывайте форму комментария.</li><li>Измените форму так, чтобы поле author_name заполнялось автоматически, если пользователь аутентифицирован.</li><li>Для этого в представлении передайте initial={'author_name': request.user.username} для GET-запроса.</li><li>Для POST-запроса, если пользователь аутентифицирован, подставьте имя перед валидацией.</li><li>Создайте простую форму поиска (не ModelForm) с одним полем query.</li><li>Добавьте поиск в представление index: если передан параметр query, фильтруйте посты по title, содержащему эту строку.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №5</h3><p>Вы создали модель Comment и форму CommentForm (ModelForm). Реализовали обработку POST-запроса в post_detail: валидацию, сохранение комментария с привязкой к посту, редирект. Добавили вывод комментариев в шаблоне. Освоили валидацию на уровне поля (clean_author_name) и на уровне формы (clean). Добавили автозаполнение для аутентифицированных пользователей и форму поиска.</p>`},
// ===================== ПРАКТИКА №6 =====================
{id:"pr6",title:"Практика №6. Загрузка файлов (медиа)",
content:`<ol><li>Добавьте в модель Post поле image (ImageField) с параметром upload_to='posts_images/', blank=True, null=True.</li><li>Установите библиотеку Pillow.</li><li>Выполните makemigrations и migrate.</li><li>В админке убедитесь, что появилось поле для загрузки изображения.</li><li>Добавьте в форму комментария возможность прикреплять изображение. Добавьте поле image в модель Comment и в форму.</li><li>В настройках settings.py добавьте MEDIA_URL = '/media/' и MEDIA_ROOT = BASE_DIR / 'media'.</li><li>В корневом urls.py добавьте статическую раздачу медиа для режима разработки с помощью static().</li><li>Проверьте, что загруженные через админку изображения отображаются на детальной странице поста.</li><li>В шаблоне post_detail.html выведите изображение поста с помощью тега img и атрибута .url.</li><li>Добавьте проверку: если у поста есть изображение, показывать его, иначе показывать заглушку (ссылка на статическое изображение).</li><li>В форме добавления комментария добавьте поле image.</li><li>Убедитесь, что в шаблоне форма имеет enctype='multipart/form-data'.</li><li>В представлении post_detail при создании комментария сохраняйте загруженное изображение.</li><li>В шаблоне post_detail.html выведите изображение комментария рядом с текстом.</li><li>Добавьте валидацию размера файла в форму комментария. Максимальный размер — 2 мегабайта.</li><li>Добавьте валидацию типа файла: разрешить только PNG, JPEG, GIF.</li><li>Проверьте, что при загрузке неподходящего файла форма не отправляется.</li><li>Создайте функцию generate_filename, которая генерирует уникальное имя файла на основе UUID.</li><li>Используйте эту функцию как upload_to для поля image в модели Comment.</li><li>Убедитесь, что имена файлов стали случайными и не конфликтуют.</li><li>Установите библиотеку sorl-thumbnail.</li><li>Добавьте в шаблон post_detail.html миниатюру изображения поста размером 300x200.</li><li>Убедитесь, что миниатюра создаётся при первом обращении.</li><li>Настройте параметр crop='center', чтобы изображение обрезалось по центру.</li><li>Добавьте в модель Post метод save, который уменьшает изображение до максимальной ширины 1200 пикселей при загрузке.</li><li>Используйте библиотеку PIL для открытия и ресайза изображения внутри метода save.</li><li>Убедитесь, что оригинальное изображение не сохраняется, если оно больше ограничения.</li><li>Добавьте в настройках переменную MAX_IMAGE_SIZE = 1200 и используйте её в модели.</li><li>В админке добавьте отображение миниатюры изображения в списке постов с помощью list_display и метода, возвращающего HTML-тег img.</li><li>Убедитесь, что загружаемые через админку изображения также проходят ресайз.</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №6</h3><p>Вы добавили изображения в модель Post и Comment. Настроили MEDIA_URL/MEDIA_ROOT. Добавили валидацию размера (2 МБ) и типа файлов (PNG/JPEG/GIF). Реализовали генерацию уникальных имён через UUID. Установили sorl-thumbnail для создания миниатюр. Добавили автоматический ресайз изображений при загрузке. Настроили отображение миниатюр в админке.</p>`},
// ===================== ПРАКТИКА №7 =====================
{id:"pr7",title:"Практика №7. Отладка, оптимизация, деплой",
content:`<ol><li>В представлении index добавьте импорт logging и создайте логгер с именем __name__.</li><li>Добавьте logger.info('Открыта страница списка постов') в начало представления.</li><li>Настройте в settings.py словарь LOGGING с обработчиком console и уровнем INFO.</li><li>Перейдите на страницу /posts/ и убедитесь, что в консоли появилось сообщение.</li><li>Измените уровень логгера на WARNING. Убедитесь, что сообщение перестало выводиться.</li><li>Установите django-debug-toolbar.</li><li>Добавьте debug_toolbar в INSTALLED_APPS.</li><li>Добавьте middleware debug_toolbar в MIDDLEWARE (в самое начало списка).</li><li>Добавьте в urls.py подключение debug_toolbar при условии DEBUG=True.</li><li>Откройте любую страницу сайта. Убедитесь, что справа появилась панель инструментов.</li><li>Откройте вкладку SQL. Посмотрите, сколько запросов выполняется на странице списка постов.</li><li>На странице детального поста добавьте цикл, который выводит комментарии. Посмотрите, сколько запросов стало.</li><li>Если запросов больше, чем ожидалось, примените select_related или prefetch_related в представлении.</li><li>Добавьте prefetch_related('comment_set') в представление post_detail.</li><li>Снова посмотрите панель инструментов. Количество запросов должно уменьшиться.</li><li>Создайте 100 постов с помощью цикла в оболочке Django.</li><li>Откройте страницу списка постов. Панель инструментов покажет время выполнения запроса.</li><li>Добавьте в модель Post индекс для поля published_date (db_index=True в определении поля).</li><li>Создайте миграцию и примените её. Замерьте время загрузки страницы снова. Оно должно улучшиться.</li><li>В настройках временно установите DEBUG = False.</li><li>Попробуйте открыть любую страницу. Что произошло? Запишите ошибку.</li><li>Установите ALLOWED_HOSTS = ['127.0.0.1', 'localhost'].</li><li>Снова откройте страницу. Теперь она должна работать.</li><li>Создайте файл .env в корне проекта. Поместите туда SECRET_KEY.</li><li>Установите библиотеку python-dotenv.</li><li>Измените settings.py, чтобы SECRET_KEY читался из переменных окружения.</li><li>Убедитесь, что проект запускается без захардкоженного ключа.</li><li>Выполните команду python manage.py collectstatic. Посмотрите, какие файлы собрались.</li><li>Установите gunicorn (pip install gunicorn).</li><li>Запустите приложение через gunicorn mynews.wsgi:application. Убедитесь, что сайт работает на другом порту, но без статики (это нормально).</li></ol>`,
conclusion:`<h3>📌 Выводы по практике №7</h3><p>Вы настроили логирование (logging). Установили и использовали django-debug-toolbar для анализа SQL-запросов. Исправили проблему N+1 через prefetch_related. Добавили индекс для оптимизации. Выключили DEBUG, настроили ALLOWED_HOSTS. Вынесли SECRET_KEY в .env. Выполнили collectstatic и запустили приложение через Gunicorn.</p>`}
];

// ===================== ПОЛНЫЙ JAVASCRIPT ДЛЯ РАБОТЫ САЙТА =====================
let activeTab = "home";
let userAnswers = new Array(testQuestions.length).fill(null);
let testSubmitted = false;

function setActiveNav() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
        const navVal = btn.getAttribute('data-nav');
        if ((navVal === 'home' && activeTab === 'home') || (navVal === 'test' && activeTab === 'test')) btn.classList.add('active');
        else btn.classList.remove('active');
    });
}

function getPrevNext(currentType, currentId) {
    let items = [];
    if (currentType === 'lec') items = lectures.map(l => ({ type: 'lec', id: l.id, title: l.title }));
    else items = practices.map(p => ({ type: 'prac', id: p.id, title: p.title }));
    const idx = items.findIndex(i => i.id === currentId);
    return { prev: idx > 0 ? items[idx-1] : null, next: idx < items.length-1 ? items[idx+1] : null };
}

function renderNavButtons(currentType, currentId) {
    const { prev, next } = getPrevNext(currentType, currentId);
    let html = '<div class="nav-buttons">';
    if (prev) html += `<div class="nav-btn-page" data-nav-type="${prev.type}" data-nav-id="${prev.id}">← Предыдущая: ${prev.title}</div>`;
    else html += `<div class="nav-btn-page" style="opacity:0.3;">← Предыдущая</div>`;
    html += `<div class="nav-btn-page" data-nav-type="home" data-nav-id="">🏠 На главную</div>`;
    if (next) html += `<div class="nav-btn-page" data-nav-type="${next.type}" data-nav-id="${next.id}">Следующая: ${next.title} →</div>`;
    else html += `<div class="nav-btn-page" style="opacity:0.3;">Следующая →</div>`;
    html += '</div>';
    return html;
}

function renderLecture(id) {
    const lec = lectures.find(l => l.id === id);
    if (!lec) return `<div class="page"><p>Лекция не найдена</p><div class="nav-btn-page" data-nav-type="home">← На главную</div></div>`;
    return `<div class="page"><div class="back" data-nav-type="home">← ко всем лекциям и практикам</div><h1>${escapeHtml(lec.title)}</h1><div class="badge">📘 лекция</div><div class="content">${lec.content}</div><div class="conclusion">${lec.conclusion}</div>${renderNavButtons('lec', id)}</div>`;
}

function renderPractice(id) {
    const prac = practices.find(p => p.id === id);
    if (!prac) return `<div class="page"><p>Практическая работа не найдена</p><div class="nav-btn-page" data-nav-type="home">← На главную</div></div>`;
    return `<div class="page"><div class="back" data-nav-type="home">← ко всем лекциям и практикам</div><h1>${escapeHtml(prac.title)}</h1><div class="badge">🛠️ практическое задание</div><div class="content">${prac.content}</div><div class="conclusion">${prac.conclusion}</div>${renderNavButtons('prac', id)}</div>`;
}

function renderHome() {
    const lecItems = lectures.map(l => `<li><a href="#" data-nav-type="lec" data-nav-id="${l.id}">📘 ${escapeHtml(l.title)}</a></li>`).join('');
    const pracItems = practices.map(p => `<li><a href="#" data-nav-type="prac" data-nav-id="${p.id}">🛠️ ${escapeHtml(p.title)}</a></li>`).join('');
    return `<div class="two-columns"><div class="block"><h2>📖 Лекции (1-7)</h2><ul class="list">${lecItems}</ul></div><div class="block"><h2>✍️ Практические работы (1-7)</h2><ul class="list">${pracItems}</ul></div></div>`;
}

function renderTest() {
    const questionsHtml = testQuestions.map((q, idx) => `<div class="question-block"><div class="question-text">${idx+1}. ${escapeHtml(q.question)}</div><div class="options">${q.options.map((opt, optIdx) => `<div class="option"><input type="radio" name="q${idx}" value="${optIdx}" id="q${idx}_${optIdx}" ${userAnswers[idx] === optIdx ? 'checked' : ''} ${testSubmitted ? 'disabled' : ''}><label for="q${idx}_${optIdx}">${escapeHtml(opt)}</label></div>`).join('')}</div></div>`).join('');
    let resultHtml = '';
    if (testSubmitted) {
        let correctCount = 0;
        for (let i = 0; i < testQuestions.length; i++) if (userAnswers[i] === testQuestions[i].correct) correctCount++;
        const percent = Math.round(correctCount / testQuestions.length * 100);
        let grade = percent >= 85 ? "Отлично! 🎉" : percent >= 65 ? "Хорошо 👍" : percent >= 45 ? "Удовлетворительно 📖" : "Стоит повторить материал 📘";
        resultHtml = `<div class="result-area">✅ Правильных ответов: ${correctCount} из ${testQuestions.length} (${percent}%)<br>${grade}</div>`;
    }
    return `<div class="test-page"><h1>📝 Проверочный тест по курсу Django</h1><p>30 вопросов. Выберите правильный ответ.</p><div id="testQuestionsContainer">${questionsHtml}</div><div class="test-actions"><button id="checkTestBtn" class="test-btn" ${testSubmitted ? 'disabled' : ''}>✅ Проверить ответы</button><button id="resetTestBtn" class="test-btn reset-btn">🔄 Сбросить все ответы</button></div>${resultHtml}</div>`;
}

function attachTestEvents() {
    for (let i = 0; i < testQuestions.length; i++) {
        const radios = document.querySelectorAll(`input[name="q${i}"]`);
        radios.forEach(radio => { radio.addEventListener('change', () => { if (!testSubmitted) userAnswers[i] = parseInt(radio.value); }); });
    }
    const checkBtn = document.getElementById('checkTestBtn');
    if (checkBtn) checkBtn.addEventListener('click', () => { testSubmitted = true; renderContentByHash(); });
    const resetBtn = document.getElementById('resetTestBtn');
    if (resetBtn) resetBtn.addEventListener('click', () => { userAnswers = new Array(testQuestions.length).fill(null); testSubmitted = false; renderContentByHash(); });
}

function renderContentByHash() {
    const hash = window.location.hash.slice(1);
    const app = document.getElementById('app');
    if (hash === 'test') { activeTab = 'test'; setActiveNav(); app.innerHTML = renderTest(); attachTestEvents(); }
    else if (hash.startsWith('lec_')) { activeTab = 'home'; setActiveNav(); app.innerHTML = renderLecture(hash.replace('lec_','')); attachNavClicks(); }
    else if (hash.startsWith('prac_')) { activeTab = 'home'; setActiveNav(); app.innerHTML = renderPractice(hash.replace('prac_','')); attachNavClicks(); }
    else { activeTab = 'home'; setActiveNav(); app.innerHTML = renderHome(); attachNavClicks(); }
}

function attachNavClicks() {
    document.querySelectorAll('[data-nav-type]').forEach(el => {
        el.removeEventListener('click', handleNavClick);
        el.addEventListener('click', handleNavClick);
    });
}

function handleNavClick(e) {
    const type = e.currentTarget.getAttribute('data-nav-type');
    const id = e.currentTarget.getAttribute('data-nav-id');
    if (type === 'home') window.location.hash = 'home';
    else if (type === 'lec') window.location.hash = `lec_${id}`;
    else if (type === 'prac') window.location.hash = `prac_${id}`;
}

function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function init() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => { const nav = btn.getAttribute('data-nav'); window.location.hash = nav === 'home' ? 'home' : 'test'; });
    });
    window.addEventListener('hashchange', renderContentByHash);
    if (!window.location.hash || window.location.hash === '#') window.location.hash = 'home';
    else renderContentByHash();
}
init();
</script>
<footer>📘 Полный курс Django: 7 лекций + 7 практических работ + тест из 30 вопросов • Все материалы из оригинальных PDF</footer>
